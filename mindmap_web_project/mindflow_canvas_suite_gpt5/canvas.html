<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindFlow Canvas · 智绘导图画布</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas for snapshot export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas-bg: #090a0d;
      --canvas-grid-dot: rgba(255, 255, 255, 0.12);
      --font-family: 'Inter', 'Noto Sans SC', sans-serif;
      --node-radius: 14px;
      --node-bg: rgba(16, 18, 26, 0.92);
      --node-border: rgba(255, 255, 255, 0.12);
      --glass-panel-bg: rgba(14, 16, 22, 0.88);
      --accent-color: #38bdf8;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    input, textarea, [contenteditable="true"] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    body { font-family: var(--font-family); background-color: var(--canvas-bg); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2f42; border-radius: 4px; }

    #canvas-container {
      background-color: var(--canvas-bg);
      background-image: radial-gradient(circle at 1.5px 1.5px, var(--canvas-grid-dot) 1.2px, transparent 0);
      background-size: 32px 32px;
      cursor: crosshair;
    }
    #canvas-container.tool-select { cursor: default; }
    #canvas-container.tool-pan { cursor: grab; }
    #canvas-container.tool-pan:active { cursor: grabbing; }
    #canvas-container.connecting { cursor: crosshair; }

    .glass-panel {
      background: rgba(14, 16, 20, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow: none;
    }
    .mf-bar {
      background: rgba(14, 16, 20, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .mf-dock {
      background: rgba(14, 16, 20, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .context-menu-glass {
      background: rgba(14, 16, 24, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
    }

    .node-theme-cyan { --node-accent: #38bdf8; --node-glow: rgba(56, 189, 248, 0.25); }
    .node-theme-purple { --node-accent: #a855f7; --node-glow: rgba(168, 85, 247, 0.25); }
    .node-theme-emerald { --node-accent: #10b981; --node-glow: rgba(16, 185, 129, 0.25); }
    .node-theme-amber { --node-accent: #f59e0b; --node-glow: rgba(245, 158, 11, 0.25); }
    .node-theme-rose { --node-accent: #f43f5e; --node-glow: rgba(244, 63, 94, 0.25); }
    .node-theme-slate { --node-accent: #94a3b8; --node-glow: rgba(148, 163, 184, 0.15); }

    .canvas-node {
      position: absolute;
      transform-origin: 0 0;
      border-radius: var(--node-radius);
      background: var(--node-bg);
      border: 1.5px solid var(--node-border);
      transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.05s ease;
    }
    .canvas-node:hover {
      box-shadow: 0 12px 35px -8px rgba(0, 0, 0, 0.7), 0 0 20px var(--node-glow, rgba(56, 189, 248, 0.15));
      border-color: rgba(255, 255, 255, 0.25) !important;
    }
    .canvas-node.is-selected {
      box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.8), 0 0 0 2px var(--node-accent, #38bdf8), 0 0 24px var(--node-glow, rgba(56, 189, 248, 0.35)) !important;
      border-color: var(--node-accent, #38bdf8) !important;
    }

    /* Placeholder Text Dimmed Styling */
    .is-placeholder {
      opacity: 0.45 !important;
      color: #94a3b8 !important;
      font-style: normal;
    }

    .port-handle {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #1e2330;
      border: 2px solid #64748b;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
      cursor: crosshair;
      z-index: 20;
      pointer-events: none;
    }
    .canvas-node:hover .port-handle,
    .canvas-node.is-selected .port-handle,
    #canvas-container.connecting .port-handle {
      opacity: 0.85;
      pointer-events: auto;
    }
    .port-handle:hover {
      opacity: 1 !important;
      transform: translate(-50%, -50%) scale(1.45);
      background: #38bdf8;
      border-color: #ffffff;
      box-shadow: 0 0 12px #38bdf8;
    }
    .port-handle.is-hub {
      width: 18px;
      height: 18px;
      opacity: 1 !important;
      pointer-events: auto !important;
      cursor: pointer;
      background: #10131a;
      border: 2px solid var(--node-accent, #38bdf8);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 28;
      box-shadow: 0 0 0 3px rgba(8,10,14,0.55);
      transform: translate(-50%, -50%) scale(var(--hub-scale, 1));
    }
    .port-handle.is-hub:hover {
      transform: translate(-50%, -50%) scale(calc(var(--hub-scale, 1) * 1.12));
      background: var(--node-accent, #38bdf8);
      color: #0b0c0f;
      border-color: #fff;
    }
    .port-handle.is-hub.is-collapsed {
      background: var(--node-accent, #38bdf8);
      color: #0b0c0f;
      border-color: #fff;
    }
    .port-handle.is-hub::after {
      content: "";
      position: absolute;
      inset: -10px;
    }
    .port-handle.is-hub .hub-count {
      position: absolute;
      top: -9px;
      right: -11px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 99px;
      background: #0b0c0f;
      border: 1px solid var(--node-accent, #38bdf8);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .canvas-node.is-branch-anim {
      transition: left 0.42s cubic-bezier(0.22, 1, 0.36, 1), top 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1) !important;
      transform-origin: 50% 50% !important;
      pointer-events: none !important;
      z-index: 6;
      will-change: left, top, transform, opacity;
    }
    .canvas-node.is-branch-hidden { display: none !important; }
    #wires-group g.is-branch-fade { transition: opacity 0.32s ease; opacity: 0; }

    @keyframes wireFlow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    .wire-flow-anim {
      stroke-dasharray: 6 6;
      animation: wireFlow 0.8s linear infinite;
    }

    .sticky-note-corner::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.28) 50%);
      pointer-events: none;
    }
    .node-shape-diamond {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }
    .diamond-plate {
      position: absolute;
      inset: 12%;
      background: var(--node-bg);
      border: 1.5px solid var(--node-accent, #38bdf8);
      transform: rotate(45deg);
      border-radius: 8px;
      pointer-events: none;
    }
    .node-shape-diamond.is-selected .diamond-plate {
      box-shadow: 0 0 0 2px var(--node-accent, #38bdf8), 0 0 22px var(--node-glow, rgba(56,189,248,.35));
    }
    .resize-handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: #fff;
      cursor: nwse-resize;
      display: none;
      z-index: 30;
    }
    .canvas-node.is-selected .resize-handle { display: block; }

    #selection-marquee {
      position: absolute;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      pointer-events: none;
      z-index: 900;
      display: none;
    }

    .inline-editor {
      outline: none;
      background: transparent;
      border: 0;
      width: 100%;
      min-width: 0;
      min-height: 1.4em;
      color: inherit;
      font: inherit;
      resize: none;
      display: block;
      pointer-events: auto;
      cursor: text;
      position: relative;
      z-index: 26;
      padding: 2px 0;
    }
    .inline-editor::placeholder { color: #94a3b8; opacity: 0.45; }
    .inline-editor:focus { background: rgba(255,255,255,0.05); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.2); }
    input.inline-editor, textarea.inline-editor {
      pointer-events: auto !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    input.inline-editor {
      height: 28px;
      min-height: 28px;
      flex: 1 1 auto;
      z-index: 26;
    }
    textarea.inline-editor { line-height: 1.45; overflow: auto; }
    .node-title { font-weight: 700; font-size: 13px; }
    .node-body { font-size: 12px; opacity: 0.92; }
    .node-title-row { position: relative; z-index: 8; min-width: 0; }
  </style>
</head>

<body class="text-slate-200 overflow-hidden w-screen h-screen m-0 p-0 select-none" oncontextmenu="return false;">

  <!-- ================= TOP HEADER BAR ================= -->
  <header class="mf-bar fixed top-0 left-0 right-0 h-12 z-50 flex items-center justify-between px-3 pointer-events-none">
    
    <!-- Left: Return to Hub + Project Title + Auto-Save Status -->
    <div class="flex items-center space-x-3 pointer-events-auto">
      <button id="btn-back-hub" title="返回项目管理中心" class="glass-panel px-3 py-2 rounded-md flex items-center space-x-1.5 text-xs text-slate-300 hover:text-white hover:border-white/30 transition">
        <i data-lucide="arrow-left" class="w-4 h-4 text-slate-400"></i>
        <span>档案</span>
      </button>

      <div class="glass-panel px-3 py-2 rounded-md flex items-center space-x-2">
        <input id="project-title-input" type="text" value="新建思维导图" 
          class="bg-transparent border-b border-transparent hover:border-slate-600 focus:border-white/40 focus:bg-white/5 rounded px-1.5 py-0.5 text-xs text-slate-100 font-semibold outline-none transition w-48">
      </div>

      <!-- Save Button & Real-Time Auto-Save Indicator -->
      <div class="glass-panel px-3 py-1.5 rounded-md flex items-center space-x-2">
        <button id="btn-manual-save" title="手动立即保存 (Ctrl+S)" class="flex items-center space-x-1 text-xs text-slate-300 hover:text-white transition">
          <i data-lucide="save" class="w-3.5 h-3.5 text-slate-400"></i>
          <span>保存</span>
        </button>
        <div class="h-3.5 w-px bg-white/10"></div>
        <div id="autosave-status" class="flex items-center space-x-1.5 text-[11px] text-slate-400 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="autosave-time-label">已自动保存 --:--:--</span>
        </div>
      </div>

      <!-- History & Auto-Layout -->
      <div class="glass-panel px-2 py-1.5 rounded-md flex items-center space-x-1">
        <button id="btn-undo" title="撤销 (Ctrl+Z)" class="p-1.5 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition disabled:opacity-30">
          <i data-lucide="undo-2" class="w-4 h-4"></i>
        </button>
        <button id="btn-redo" title="重做 (Ctrl+Y / Shift+Ctrl+Z)" class="p-1.5 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition disabled:opacity-30">
          <i data-lucide="redo-2" class="w-4 h-4"></i>
        </button>
        <div class="h-4 w-px bg-white/10 mx-0.5"></div>
        <button id="btn-auto-layout" title="智能自动排版 (整理为树状导图)" class="flex items-center space-x-1 px-2.5 py-1 text-xs text-slate-300 hover:bg-white/10 rounded-lg border border-white/10 transition">
          <i data-lucide="git-merge" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span>一键整理</span>
        </button>
      </div>
    </div>

    <!-- Right: Templates, Export, Zoom & Actions -->
    <div class="flex items-center space-x-2.5 pointer-events-auto">
      
      <!-- Preset Templates Menu -->
      <div class="relative">
        <button id="btn-templates-toggle" class="glass-panel px-3 py-2 rounded-md flex items-center space-x-2 text-xs text-slate-300 hover:text-white hover:border-white/20 transition">
          <i data-lucide="layout-template" class="w-4 h-4 text-slate-400"></i>
          <span>模板</span>
          <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
        </button>

        <div id="templates-dropdown" class="hidden absolute right-0 mt-2 w-64 glass-panel p-2 rounded-md shadow-2xl border border-white/10 flex flex-col space-y-1 z-50">
          <div class="px-2 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">选择模板</div>
          <button data-template="creative_pipeline" class="flex items-start space-x-2.5 p-2 rounded-md hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="cpu" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">创意影视创作管线</div>
              <div class="text-[10px] text-slate-400">剧本 -> 分镜 -> 调色 -> 输出</div>
            </div>
          </button>
          <button data-template="mindmap_tree" class="flex items-start space-x-2.5 p-2 rounded-md hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="network" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">商业产品思维导图</div>
              <div class="text-[10px] text-slate-400">核心论点、发散分支与多级脉络</div>
            </div>
          </button>
          <button data-template="decision_arch" class="flex items-start space-x-2.5 p-2 rounded-md hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="git-fork" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">系统架构与决策树</div>
              <div class="text-[10px] text-slate-400">条件判断、服务分支与正交流向</div>
            </div>
          </button>
          <button data-template="blank" class="flex items-start space-x-2.5 p-2 rounded-md hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="file-plus" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">清空为纯净空白画布</div>
              <div class="text-[10px] text-slate-400">从零自由创作</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Zoom & Viewport Controls -->
      <div class="glass-panel px-2.5 py-1.5 rounded-md flex items-center space-x-1.5 text-xs">
        <button id="btn-zoom-out" title="缩小" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <span id="zoom-level-label" class="font-mono text-slate-300 min-w-[42px] text-center font-medium">100%</span>
        <button id="btn-zoom-in" title="放大" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        </button>
        <div class="h-4 w-px bg-white/10 mx-0.5"></div>
        <button id="btn-fit-view" title="适应屏幕 (居中全部节点)" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Export Button (Clean Minimalist Solid Black/White, No Loud AI Gradients) -->
      <button id="btn-open-export" class="px-4 py-2 rounded-md bg-white text-black hover:bg-slate-200 text-xs font-medium shadow-md flex items-center space-x-1.5 transition transform active:scale-95">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>导出图片 / 存档</span>
      </button>
    </div>
  </header>


  <!-- ================= MAIN VIEWPORT & CANVAS ================= -->
  <main id="canvas-viewport" class="relative w-screen h-screen overflow-hidden select-none">
    
    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full transform-origin-0-0">
      
      <div id="canvas-world" class="absolute top-0 left-0" style="transform: translate(0px, 0px) scale(1);">
        
        <!-- SVG Connections Layer -->
        <svg id="svg-connections-layer" class="absolute top-0 left-0 overflow-visible pointer-events-none z-10" style="width: 1px; height: 1px;">
          <defs>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" /></marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" /></marker>
            <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" /></marker>
            <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" /></marker>
            <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" /></marker>
            <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" /></marker>
          </defs>

          <g id="wires-group" class="pointer-events-auto"></g>
          <path id="temp-drag-wire" class="wire-flow-anim" d="" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0" marker-end="url(#arrow-cyan)"></path>
        </svg>

        <div id="nodes-layer" class="absolute top-0 left-0 z-20"></div>
        <div id="frames-layer" class="absolute top-0 left-0 z-0"></div>

      </div>

      <!-- Marquee Drag Selection Box -->
      <div id="selection-marquee"></div>

    </div>

  </main>


  <!-- ================= FLOATING BOTTOM DOCK ================= -->
  <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center space-x-1.5 p-1.5 rounded-md glass-panel shadow-2xl border border-white/10">
    <button data-tool="select" title="选择与拖拽 (V)" class="dock-tool-btn active flex flex-col items-center justify-center w-11 h-11 rounded-md text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="mouse-pointer" class="w-5 h-5"></i>
      <span class="text-[9px] mt-0.5 opacity-70">选择</span>
    </button>
    <button data-tool="pan" title="抓手平移 (H / 空格拖拽)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-md text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="hand" class="w-5 h-5"></i>
      <span class="text-[9px] mt-0.5 opacity-70">抓手</span>
    </button>

    <div class="h-6 w-px bg-white/10 mx-1"></div>

    <button data-create="card" title="新建卡片 (C)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-md text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="square" class="w-5 h-5 text-cyan-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">卡片</span>
    </button>
    <button data-create="circle" title="新建椭圆泡泡 (O)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-md text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="circle" class="w-5 h-5 text-purple-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">椭圆</span>
    </button>
    <button data-create="rect" title="新建方格 (R)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-md text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="box" class="w-5 h-5 text-emerald-400"></i>

    function screenToWorld(screenX, screenY) {
      const rect = dom.viewport.getBoundingClientRect();
      const x = (screenX - rect.left - state.panX) / state.zoom;

    // --- AUTO SAVE & PROJECT REGISTRY SYNC ---
    function triggerAutoSave() {
      clearTimeout(state.autoSaveTimer);
      state.autoSaveTimer = setTimeout(() => {
        performSave();
      }, 300);
    }

    function performSave() {
      try {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        // 1. Save project payload
        const payload = JSON.stringify({
          id: state.projectId,
          projectTitle: state.projectTitle,
          nodes: state.nodes,
          wires: state.wires,
          updatedAt: now.toISOString()
        });
        localStorage.setItem(`mindflow_gpt5_project_${state.projectId}`, payload);

        // 2. Synchronize to registry
        let registry = [];
        try {
          registry = JSON.parse(localStorage.getItem(HUB_STORAGE_KEY) || '[]');
        } catch (e) {}

        const firstNodeContent = state.nodes[0] ? (state.nodes[0].content || state.nodes[0].title) : '';
        const desc = firstNodeContent ? firstNodeContent.slice(0, 50) : '思维导图工程';

        const existingIdx = registry.findIndex(p => p.id === state.projectId);
        const entry = {
          id: state.projectId,
          title: state.projectTitle || '未命名导图',
          description: desc,
          nodeCount: state.nodes.length,
          wireCount: state.wires.length,
          updatedAt: now.toISOString()
        };

        if (existingIdx >= 0) {
          registry[existingIdx] = entry;
        } else {
          registry.unshift(entry);
        }
        localStorage.setItem(HUB_STORAGE_KEY, JSON.stringify(registry));

        // 3. Update Indicator
        dom.autosaveTimeLabel.textContent = `已自动保存 ${timeStr}`;
      } catch (e) {
        console.error("Save error:", e);
      }
    }

    function saveHistory() {

      const snapshot = JSON.stringify({
        nodes: state.nodes,
        wires: state.wires,
        projectTitle: state.projectTitle
      });
      state.history.push(snapshot);
      if (state.history.length > 40) state.history.shift();
      state.historyIndex = state.history.length - 1;
      updateHistoryButtons();
      triggerAutoSave();
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        loadSnapshot(state.history[state.historyIndex]);

    // --- NODE RENDERING ---
    function getNodePortCoord(node, port) {
      const x = node.x, y = node.y, w = node.width, h = node.height;
      switch (port) {
        case 'top': return { x: x + w / 2, y: y };
        case 'right': return { x: x + w, y: y + h / 2 };
        case 'bottom': return { x: x + w / 2, y: y + h };
        case 'left': return { x: x, y: y + h / 2 };
       default: return { x: x + w / 2, y: y + h / 2 };
     }
   }

    function outgoingWires(nodeId, port) {
      return state.wires.filter(w => w.fromNode === nodeId && (!port || (w.fromPort || "right") === port));
    }
    function collectBranch(nodeId, port) {
      const ids = [];
      const queue = outgoingWires(nodeId, port).map(w => w.toNode);
      const seen = new Set(queue);
      while (queue.length) {
        const id = queue.shift();
        ids.push(id);
        state.wires.filter(w => w.fromNode === id).forEach(w => {
          if (!seen.has(w.toNode)) { seen.add(w.toNode); queue.push(w.toNode); }
        });
      }
      return ids;
    }
    function collectAllDescendants(nodeId) {
      return collectBranch(nodeId, null);
    }
    function armDragForNodes(ids, clientX, clientY) {
      state.dragArmed = true;
      state.isDraggingNode = false;
      state.dragStartPos = { x: clientX, y: clientY };
      state.nodesDragInitialPos.clear();
      ids.forEach(id => {
        [id, ...collectAllDescendants(id)].forEach(did => {
          if (state.nodesDragInitialPos.has(did)) return;
          const n = state.nodes.find(item => item.id === did);
          if (n) state.nodesDragInitialPos.set(did, { x: n.x, y: n.y });
        });
      });
    }
    function getHiddenNodeIds() {
      const hidden = new Set();
      state.nodes.forEach(n => {
        (n.collapsedPorts || []).forEach(port => {
          collectBranch(n.id, port).forEach(id => hidden.add(id));
        });
      });
      if (state.collapseAnim && state.collapseAnim.ids) {
        state.collapseAnim.ids.forEach(id => hidden.delete(id));
      }
      return hidden;
    }
    function ensureCollapsedPorts(node) {
      if (!Array.isArray(node.collapsedPorts)) node.collapsedPorts = [];
      return node.collapsedPorts;
    }
    function paintHub(node, port) {
      const el = document.querySelector("#node-" + node.id + " .port-handle[data-port='" + port + "']");
      if (!el) return;
      const outs = outgoingWires(node.id, port);
      if (!outs.length) {
        el.classList.remove("is-hub", "is-collapsed");
        el.innerHTML = "";
        el.removeAttribute("title");
        return;
      }
      const collapsed = (node.collapsedPorts || []).includes(port);
      const count = collectBranch(node.id, port).length;
      el.classList.add("is-hub");
      el.classList.toggle("is-collapsed", collapsed);
      el.title = collapsed ? "展开子层级" : "收起子层级";
      el.innerHTML = collapsed ? ("+" + (count ? '<span class="hub-count">' + count + "</span>" : "")) : "–";
    }
    function toggleBranch(nodeId, port) {
      if (state.branchAnimating) return;
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;
      const branchIds = collectBranch(nodeId, port);
      if (!branchIds.length) return;
      const collapsed = ensureCollapsedPorts(node).includes(port);
      if (collapsed) expandBranch(node, port, branchIds);
      else collapseBranch(node, port, branchIds);
    }
    function collapseBranch(node, port, branchIds) {
      const alreadyHidden = getHiddenNodeIds();
      const animateIds = branchIds.filter(id => !alreadyHidden.has(id));
      if (!ensureCollapsedPorts(node).includes(port)) node.collapsedPorts.push(port);
      state.branchAnimating = true;
      state.collapseAnim = { ids: new Set(animateIds), hub: getNodePortCoord(node, port) };
      const hub = state.collapseAnim.hub;
      const hiding = new Set(animateIds);
      state.wires.forEach(w => {
        if (hiding.has(w.fromNode) || hiding.has(w.toNode)) {
          const g = document.querySelector('[data-wire-id="' + w.id + '"]');
          if (g) g.classList.add("is-branch-fade");
        }
      });
      paintHub(node, port);
      animateIds.forEach((id, i) => {
        const n = state.nodes.find(item => item.id === id);
        const el = document.getElementById("node-" + id);
        if (!n || !el) return;
        el.classList.add("is-branch-anim");
        el.style.transitionDelay = Math.min(i * 16, 90) + "ms";
        el.style.left = (hub.x - n.width / 2) + "px";
        el.style.top = (hub.y - n.height / 2) + "px";
        el.style.opacity = "0";
        el.style.transform = "scale(0.42)";
        state.selectedNodeIds.delete(id);
      });
      const wait = 430 + Math.min(Math.max(animateIds.length - 1, 0) * 16, 90);
      setTimeout(() => {
        state.collapseAnim = null;
        state.branchAnimating = false;
        saveHistory();
        renderAll();
      }, wait);
    }
    function expandBranch(node, port, branchIds) {
      state.branchAnimating = true;
      node.collapsedPorts = ensureCollapsedPorts(node).filter(p => p !== port);
      const stillHidden = getHiddenNodeIds();
      const showIds = branchIds.filter(id => !stillHidden.has(id));
      const hub = getNodePortCoord(node, port);
      state.expandAnim = { ids: new Set(showIds), hub };
      paintHub(node, port);
      renderAll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          showIds.forEach((id, i) => {
            const n = state.nodes.find(item => item.id === id);
            const el = document.getElementById("node-" + id);
            if (!n || !el) return;
            el.style.transitionDelay = Math.min(i * 16, 90) + "ms";
            el.style.left = n.x + "px";
            el.style.top = n.y + "px";
            el.style.opacity = "1";
            el.style.transform = "scale(1)";
          });
          document.querySelectorAll("#wires-group g.is-branch-fade").forEach(g => {
            g.style.opacity = "1";
            g.classList.remove("is-branch-fade");
          });
        });
      });
      const wait = 450 + Math.min(Math.max(showIds.length - 1, 0) * 16, 90);
      setTimeout(() => {
        state.expandAnim = null;
        state.branchAnimating = false;
        saveHistory();
        renderAll();
      }, wait);
    }

    function isPlaceholderText(txt) {
      if (!txt) return true;
      return KNOWN_PLACEHOLDERS.has(txt.trim());
    }

    function fieldValue(text) {
      return isPlaceholderText(text) ? "" : String(text || "");
    }
    function escAttr(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function editorMarkup(node, field, placeholder, extraClass) {
      const raw = field === "title" ? node.title : node.content;
      const value = escAttr(fieldValue(raw));
      if (field === "title") {
        return '<input type="text" class="inline-editor node-title ' + (extraClass || "") + '" data-field="title" data-default="' + escAttr(placeholder) + '" placeholder="' + escAttr(placeholder) + '" value="' + value + '" autocomplete="off" spellcheck="false">';
      }
      return '<textarea class="inline-editor node-body ' + (extraClass || "") + '" data-field="content" data-default="' + escAttr(placeholder) + '" placeholder="' + escAttr(placeholder) + '" rows="3" spellcheck="false">' + value + '</textarea>';
    }

    function createNodeElement(node) {
      return createNodeElementInner(node);
    }
    function portMarkup(node, port, style) {
      const outs = outgoingWires(node.id, port);
      const collapsed = (node.collapsedPorts || []).includes(port);
      if (!outs.length) return '<div class="port-handle" data-port="' + port + '" style="' + style + ';"></div>';
      const count = collectBranch(node.id, port).length;
      const cls = "port-handle is-hub" + (collapsed ? " is-collapsed" : "");
      const inner = collapsed ? ("+" + (count ? '<span class="hub-count">' + count + "</span>" : "")) : "–";
      const hubScale = Math.max(1, 1 / (state.zoom || 1));
      return '<div class="' + cls + '" data-port="' + port + '" title="' + (collapsed ? "展开子层级" : "收起子层级") + '" style="' + style + ';transform:translate(-50%,-50%) scale(' + hubScale + ');">' + inner + "</div>";
    }
    function createNodeElementInner(node) {
      const div = document.createElement("div");
      div.id = "node-" + node.id;
      div.className = "canvas-node node-theme-" + (node.color || "cyan") + (state.selectedNodeIds.has(node.id) ? " is-selected" : "");
      div.style.left = node.x + "px";
      div.style.top = node.y + "px";
      div.style.width = node.width + "px";
      div.style.height = node.height + "px";
      div.style.zIndex = node.zIndex || 10;
      if (state.expandAnim && state.expandAnim.ids.has(node.id)) {
        div.classList.add("is-branch-anim");
        div.style.left = (state.expandAnim.hub.x - node.width / 2) + "px";
        div.style.top = (state.expandAnim.hub.y - node.height / 2) + "px";
        div.style.opacity = "0";
        div.style.transform = "scale(0.42)";
      }

      let innerHTML = "";
      if (node.shape === "circle") {
        div.style.borderRadius = "50%";
        innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center p-5 text-center gap-1">' +
          '<div class="node-title-row w-full">' + editorMarkup(node, "title", "思维原点") + "</div>" +
          editorMarkup(node, "content", "双击编辑内容...", "text-center") +
          "</div>";
      } else if (node.shape === "diamond") {
        div.classList.add("node-shape-diamond");
