<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindFlow Canvas · 智绘导图画布</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas for snapshot export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas-bg: #090a0d;
      --canvas-grid-dot: rgba(255, 255, 255, 0.12);
      --font-family: 'Inter', 'Noto Sans SC', sans-serif;
      --node-radius: 14px;
      --node-bg: rgba(16, 18, 26, 0.92);
      --node-border: rgba(255, 255, 255, 0.12);
      --glass-panel-bg: rgba(14, 16, 22, 0.88);
      --accent-color: #38bdf8;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    input, textarea, [contenteditable="true"] { user-select: text; -webkit-user-select: text; }
    body { font-family: var(--font-family); background-color: var(--canvas-bg); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2f42; border-radius: 4px; }

    #canvas-container {
      background-color: var(--canvas-bg);
      background-image: radial-gradient(circle at 1.5px 1.5px, var(--canvas-grid-dot) 1.2px, transparent 0);
      background-size: 32px 32px;
      cursor: crosshair;
    }
    #canvas-container.tool-select { cursor: default; }
    #canvas-container.tool-pan { cursor: grab; }
    #canvas-container.tool-pan:active { cursor: grabbing; }
    #canvas-container.connecting { cursor: crosshair; }

    .glass-panel {
      background: var(--glass-panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7);
    }
    .context-menu-glass {
      background: rgba(14, 16, 24, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
    }

    .node-theme-cyan { --node-accent: #38bdf8; --node-glow: rgba(56, 189, 248, 0.25); }
    .node-theme-purple { --node-accent: #a855f7; --node-glow: rgba(168, 85, 247, 0.25); }
    .node-theme-emerald { --node-accent: #10b981; --node-glow: rgba(16, 185, 129, 0.25); }
    .node-theme-amber { --node-accent: #f59e0b; --node-glow: rgba(245, 158, 11, 0.25); }
    .node-theme-rose { --node-accent: #f43f5e; --node-glow: rgba(244, 63, 94, 0.25); }
    .node-theme-slate { --node-accent: #94a3b8; --node-glow: rgba(148, 163, 184, 0.15); }

    .canvas-node {
      position: absolute;
      transform-origin: 0 0;
      border-radius: var(--node-radius);
      background: var(--node-bg);
      border: 1.5px solid var(--node-border);
      transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.05s ease;
    }
    .canvas-node:hover {
      box-shadow: 0 12px 35px -8px rgba(0, 0, 0, 0.7), 0 0 20px var(--node-glow, rgba(56, 189, 248, 0.15));
      border-color: rgba(255, 255, 255, 0.25) !important;
    }
    .canvas-node.is-selected {
      box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.8), 0 0 0 2px var(--node-accent, #38bdf8), 0 0 24px var(--node-glow, rgba(56, 189, 248, 0.35)) !important;
      border-color: var(--node-accent, #38bdf8) !important;
    }

    /* Placeholder Text Dimmed Styling */
    .is-placeholder {
      opacity: 0.45 !important;
      color: #94a3b8 !important;
      font-style: normal;
    }

    .port-handle {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #1e2330;
      border: 2px solid #64748b;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
      cursor: crosshair;
      z-index: 20;
    }
    .canvas-node:hover .port-handle,
    .canvas-node.is-selected .port-handle,
    #canvas-container.connecting .port-handle {
      opacity: 0.85;
    }
    .port-handle:hover {
      opacity: 1 !important;
      transform: translate(-50%, -50%) scale(1.45);
      background: #38bdf8;
      border-color: #ffffff;
      box-shadow: 0 0 12px #38bdf8;
    }

    @keyframes wireFlow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    .wire-flow-anim {
      stroke-dasharray: 6 6;
      animation: wireFlow 0.8s linear infinite;
    }

    .sticky-note-corner::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.3) 50%);
      pointer-events: none;
    }

    #selection-marquee {
      position: absolute;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      pointer-events: none;
      z-index: 900;
      display: none;
    }

    .inline-editor { outline: none; background: transparent; word-break: break-word; }
  </style>
</head>

<body class="text-slate-200 overflow-hidden w-screen h-screen m-0 p-0 select-none" oncontextmenu="return false;">

  <!-- ================= TOP HEADER BAR ================= -->
  <header class="fixed top-3 left-4 right-4 z-50 flex items-center justify-between pointer-events-none">
    
    <!-- Left: Return to Hub + Project Title + Auto-Save Status -->
    <div class="flex items-center space-x-3 pointer-events-auto">
      <button id="btn-back-hub" title="返回项目管理中心" class="glass-panel px-3 py-2 rounded-xl flex items-center space-x-1.5 text-xs text-slate-300 hover:text-white hover:border-white/30 transition">
        <i data-lucide="arrow-left" class="w-4 h-4 text-slate-400"></i>
        <span>项目中心</span>
      </button>

      <div class="glass-panel px-3 py-2 rounded-xl flex items-center space-x-2">
        <input id="project-title-input" type="text" value="新建思维导图" 
          class="bg-transparent border-b border-transparent hover:border-slate-600 focus:border-white/40 focus:bg-white/5 rounded px-1.5 py-0.5 text-xs text-slate-100 font-semibold outline-none transition w-48">
      </div>

      <!-- Save Button & Real-Time Auto-Save Indicator -->
      <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center space-x-2">
        <button id="btn-manual-save" title="手动立即保存 (Ctrl+S)" class="flex items-center space-x-1 text-xs text-slate-300 hover:text-white transition">
          <i data-lucide="save" class="w-3.5 h-3.5 text-slate-400"></i>
          <span>保存</span>
        </button>
        <div class="h-3.5 w-px bg-white/10"></div>
        <div id="autosave-status" class="flex items-center space-x-1.5 text-[11px] text-slate-400 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="autosave-time-label">已自动保存</span>
        </div>
      </div>

      <!-- History & Auto-Layout -->
      <div class="glass-panel px-2 py-1.5 rounded-xl flex items-center space-x-1">
        <button id="btn-undo" title="撤销 (Ctrl+Z)" class="p-1.5 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition disabled:opacity-30">
          <i data-lucide="undo-2" class="w-4 h-4"></i>
        </button>
        <button id="btn-redo" title="重做 (Ctrl+Y / Shift+Ctrl+Z)" class="p-1.5 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition disabled:opacity-30">
          <i data-lucide="redo-2" class="w-4 h-4"></i>
        </button>
        <div class="h-4 w-px bg-white/10 mx-0.5"></div>
        <button id="btn-auto-layout" title="智能自动排版 (整理为树状导图)" class="flex items-center space-x-1 px-2.5 py-1 text-xs text-slate-300 hover:bg-white/10 rounded-lg border border-white/10 transition">
          <i data-lucide="git-merge" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span>一键整理</span>
        </button>
      </div>
    </div>

    <!-- Right: Templates, Export, Zoom & Actions -->
    <div class="flex items-center space-x-2.5 pointer-events-auto">
      
      <!-- Preset Templates Menu -->
      <div class="relative">
        <button id="btn-templates-toggle" class="glass-panel px-3 py-2 rounded-xl flex items-center space-x-2 text-xs text-slate-300 hover:text-white hover:border-white/20 transition">
          <i data-lucide="layout-template" class="w-4 h-4 text-slate-400"></i>
          <span>模板</span>
          <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
        </button>

        <div id="templates-dropdown" class="hidden absolute right-0 mt-2 w-64 glass-panel p-2 rounded-2xl shadow-2xl border border-white/10 flex flex-col space-y-1 z-50">
          <div class="px-2 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">选择模板</div>
          <button data-template="creative_pipeline" class="flex items-start space-x-2.5 p-2 rounded-xl hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="cpu" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">创意影视创作管线</div>
              <div class="text-[10px] text-slate-400">剧本 -> 分镜 -> 调色 -> 输出</div>
            </div>
          </button>
          <button data-template="mindmap_tree" class="flex items-start space-x-2.5 p-2 rounded-xl hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="network" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">商业产品思维导图</div>
              <div class="text-[10px] text-slate-400">核心论点、发散分支与多级脉络</div>
            </div>
          </button>
          <button data-template="decision_arch" class="flex items-start space-x-2.5 p-2 rounded-xl hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="git-fork" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">系统架构与决策树</div>
              <div class="text-[10px] text-slate-400">条件判断、服务分支与正交流向</div>
            </div>
          </button>
          <button data-template="blank" class="flex items-start space-x-2.5 p-2 rounded-xl hover:bg-white/10 text-left transition">
            <div class="p-1.5 rounded-lg bg-white/10 text-white"><i data-lucide="file-plus" class="w-4 h-4"></i></div>
            <div>
              <div class="text-xs font-semibold text-white">清空为纯净空白画布</div>
              <div class="text-[10px] text-slate-400">从零自由创作</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Zoom & Viewport Controls -->
      <div class="glass-panel px-2.5 py-1.5 rounded-xl flex items-center space-x-1.5 text-xs">
        <button id="btn-zoom-out" title="缩小" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <span id="zoom-level-label" class="font-mono text-slate-300 min-w-[42px] text-center font-medium">100%</span>
        <button id="btn-zoom-in" title="放大" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        </button>
        <div class="h-4 w-px bg-white/10 mx-0.5"></div>
        <button id="btn-fit-view" title="适应屏幕 (居中全部节点)" class="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded transition">
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Export Button (Clean Minimalist Solid Black/White, No Loud AI Gradients) -->
      <button id="btn-open-export" class="px-4 py-2 rounded-xl bg-white text-black hover:bg-slate-200 text-xs font-medium shadow-md flex items-center space-x-1.5 transition transform active:scale-95">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>导出图片 / 存档</span>
      </button>
    </div>
  </header>


  <!-- ================= MAIN VIEWPORT & CANVAS ================= -->
  <main id="canvas-viewport" class="relative w-screen h-screen overflow-hidden select-none">
    
    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full transform-origin-0-0">
      
      <div id="canvas-world" class="absolute top-0 left-0" style="transform: translate(0px, 0px) scale(1);">
        
        <!-- SVG Connections Layer -->
        <svg id="svg-connections-layer" class="absolute top-0 left-0 overflow-visible pointer-events-none z-10" style="width: 1px; height: 1px;">
          <defs>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" /></marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" /></marker>
            <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" /></marker>
            <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" /></marker>
            <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" /></marker>
            <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" /></marker>
          </defs>

          <g id="wires-group" class="pointer-events-auto"></g>
          <path id="temp-drag-wire" class="wire-flow-anim" d="" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0" marker-end="url(#arrow-cyan)"></path>
        </svg>

        <div id="nodes-layer" class="absolute top-0 left-0 z-20"></div>
        <div id="frames-layer" class="absolute top-0 left-0 z-0"></div>

      </div>

      <!-- Marquee Drag Selection Box -->
      <div id="selection-marquee"></div>

    </div>

  </main>


  <!-- ================= FLOATING BOTTOM DOCK ================= -->
  <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center space-x-1.5 p-1.5 rounded-2xl glass-panel shadow-2xl border border-white/10">
    <button data-tool="select" title="选择与拖拽 (V)" class="dock-tool-btn active flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="mouse-pointer" class="w-5 h-5"></i>
      <span class="text-[9px] mt-0.5 opacity-70">选择</span>
    </button>
    <button data-tool="pan" title="抓手平移 (H / 空格拖拽)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="hand" class="w-5 h-5"></i>
      <span class="text-[9px] mt-0.5 opacity-70">抓手</span>
    </button>

    <div class="h-6 w-px bg-white/10 mx-1"></div>

    <button data-create="card" title="新建卡片 (C)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="square" class="w-5 h-5 text-cyan-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">卡片</span>
    </button>
    <button data-create="circle" title="新建椭圆泡泡 (O)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="circle" class="w-5 h-5 text-purple-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">椭圆</span>
    </button>
    <button data-create="rect" title="新建方格 (R)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="box" class="w-5 h-5 text-emerald-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">方格</span>
    </button>
    <button data-create="diamond" title="新建菱形分支 (D)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="diamond" class="w-5 h-5 text-amber-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">菱形</span>
    </button>
    <button data-create="sticky" title="新建便签 (N)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="sticky-note" class="w-5 h-5 text-yellow-300"></i>
      <span class="text-[9px] mt-0.5 opacity-70">便签</span>
    </button>
    <button data-create="pill" title="新建胶囊 (P)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="tag" class="w-5 h-5 text-rose-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">胶囊</span>
    </button>
    <button data-create="frame" title="新建分组框 (F)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="boxes" class="w-5 h-5 text-indigo-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">分组</span>
    </button>
    <button data-create="ai_prompt" title="新建创作节点 (A)" class="dock-tool-btn flex flex-col items-center justify-center w-11 h-11 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition">
      <i data-lucide="sparkles" class="w-5 h-5 text-fuchsia-400"></i>
      <span class="text-[9px] mt-0.5 opacity-70">创作块</span>
    </button>

    <div class="h-6 w-px bg-white/10 mx-1"></div>

    <button id="btn-add-mind-branch" title="一键扩展子分支 (Tab)" class="flex items-center space-x-1 px-3 h-11 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-white transition">
      <i data-lucide="plus-circle" class="w-4 h-4"></i>
      <span class="text-xs font-medium">扩展分支</span>
      <kbd class="text-[9px] px-1 bg-black/40 rounded border border-white/20 text-slate-300 font-mono">Tab</kbd>
    </button>
  </nav>


  <!-- ================= CANVAS BLANK AREA RIGHT-CLICK CONTEXT MENU ================= -->
  <div id="canvas-context-menu" class="hidden fixed z-50 context-menu-glass py-1.5 px-1 rounded-2xl w-52 text-xs text-slate-200 shadow-2xl flex flex-col space-y-0.5">
    <div class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">新建节点图形</div>
    <button data-create-ctx="card" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="square" class="w-3.5 h-3.5 text-cyan-400"></i><span>主题卡片 (Card)</span>
    </button>
    <button data-create-ctx="circle" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="circle" class="w-3.5 h-3.5 text-purple-400"></i><span>椭圆思维泡泡 (Circle)</span>
    </button>
    <button data-create-ctx="rect" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="box" class="w-3.5 h-3.5 text-emerald-400"></i><span>矩形模块方格 (Rect)</span>
    </button>
    <button data-create-ctx="diamond" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="diamond" class="w-3.5 h-3.5 text-amber-400"></i><span>菱形决策逻辑 (Diamond)</span>
    </button>
    <button data-create-ctx="sticky" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="sticky-note" class="w-3.5 h-3.5 text-yellow-300"></i><span>随笔便签 (Sticky)</span>
    </button>
    <button data-create-ctx="pill" class="ctx-item flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-white/10 transition text-left">
      <i data-lucide="tag" class="w-3.5 h-3.5 text-rose-400"></i><span>状态标签 (Pill)</span>

          projectTitle: state.projectTitle,
          nodes: state.nodes,
          wires: state.wires,
          updatedAt: now.toISOString()
        });
        localStorage.setItem(`canvas_project_${state.projectId}`, payload);

        // 2. Synchronize to registry
        let registry = [];
        try {
          registry = JSON.parse(localStorage.getItem(HUB_STORAGE_KEY) || '[]');
        } catch (e) {}

        const firstNodeContent = state.nodes[0] ? (state.nodes[0].content || state.nodes[0].title) : '';
        const desc = firstNodeContent ? firstNodeContent.slice(0, 50) : '思维导图工程';

        const existingIdx = registry.findIndex(p => p.id === state.projectId);
        const entry = {
          id: state.projectId,
          title: state.projectTitle || '未命名导图',
          description: desc,
          nodeCount: state.nodes.length,
          wireCount: state.wires.length,
          updatedAt: now.toISOString()
        };

        if (existingIdx >= 0) {
          registry[existingIdx] = entry;
        } else {
          registry.unshift(entry);
        }
        localStorage.setItem(HUB_STORAGE_KEY, JSON.stringify(registry));

        // 3. Update Indicator
        dom.autosaveTimeLabel.textContent = `已自动保存 ${timeStr}`;
      } catch (e) {
        console.error("Save error:", e);
      }
    }

    function saveHistory() {
      state.history = state.history.slice(0, state.historyIndex + 1);
      const snapshot = JSON.stringify({
        nodes: state.nodes,
        wires: state.wires,
        projectTitle: state.projectTitle
      });
      state.history.push(snapshot);
      if (state.history.length > 40) state.history.shift();
      state.historyIndex = state.history.length - 1;
      updateHistoryButtons();
      triggerAutoSave();
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        loadSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        loadSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
      }
    }

    function updateHistoryButtons() {
      document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
      document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
    }

    function loadSnapshot(jsonString) {
      try {
        const data = JSON.parse(jsonString);
        state.nodes = data.nodes || [];
        state.wires = data.wires || [];
        if (data.projectTitle) {
          state.projectTitle = data.projectTitle;
          dom.projectTitleInput.value = data.projectTitle;
        }
        renderAll();
      } catch (e) {}
    }

    function loadFromStorage() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const projId = urlParams.get('project');
        const tplKey = urlParams.get('template');

        if (projId) {
          state.projectId = projId;
          const saved = localStorage.getItem(`canvas_project_${projId}`);
          if (saved) {
            loadSnapshot(saved);
            return true;
          }
        }

        if (tplKey && TEMPLATES[tplKey]) {
          loadTemplate(tplKey);
          return true;
        }
      } catch (e) {}
      return false;
    }

    // --- NODE RENDERING ---
    function getNodePortCoord(node, port) {
      const x = node.x, y = node.y, w = node.width, h = node.height;
      switch (port) {
        case 'top': return { x: x + w / 2, y: y };
        case 'right': return { x: x + w, y: y + h / 2 };
        case 'bottom': return { x: x + w / 2, y: y + h };
        case 'left': return { x: x, y: y + h / 2 };
        default: return { x: x + w / 2, y: y + h / 2 };
      }
    }

    function isPlaceholderText(txt) {
      if (!txt) return true;
      return KNOWN_PLACEHOLDERS.has(txt.trim());
    }

              </div>
              ${node.tag ? `<span class="text-[9px] px-1.5 py-0.2 rounded font-mono bg-white/10 text-slate-300">${node.tag}</span>` : ''}
            </div>
            <div class="inline-editor text-xs text-slate-300 flex-1 whitespace-pre-wrap outline-none leading-relaxed ${isContentPlaceholder ? 'is-placeholder' : ''}" contenteditable="true" data-field="content" data-default="双击编辑内容...">${node.content || ''}</div>

        <div class="port-handle" data-port="bottom" style="top: 100%; left: 50%;"></div>
        <div class="port-handle" data-port="left" style="top: 50%; left: 0%;"></div>
      `;

      div.innerHTML = innerHTML;
      setupNodeInteractions(div, node);
      return div;
    }

    function setupNodeInteractions(el, node) {
      const editables = el.querySelectorAll('[contenteditable="true"]');
      editables.forEach(editable => {
        editable.addEventListener('mousedown', (e) => e.stopPropagation());
        
        // Auto-clear placeholder on focus!
        editable.addEventListener('focus', () => {
          const currentText = editable.innerText.trim();
          if (isPlaceholderText(currentText)) {
            editable.innerText = '';
            editable.classList.remove('is-placeholder');
          }
        });

        editable.addEventListener('blur', () => {
          const field = editable.getAttribute('data-field');
          const fallback = editable.getAttribute('data-default') || '';
          let text = editable.innerText.trim();
          
          if (!text) {
            text = fallback;
            editable.innerText = fallback;
            editable.classList.add('is-placeholder');
          } else if (isPlaceholderText(text)) {
            editable.classList.add('is-placeholder');
          } else {
            editable.classList.remove('is-placeholder');
          }

          node[field] = text;
          saveHistory();
          renderMinimap();
        });

        editable.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && editable.getAttribute('data-field') === 'title') {
            e.preventDefault();
            editable.blur();
          }
        });
      });

      const ports = el.querySelectorAll('.port-handle');
      ports.forEach(portEl => {
        portEl.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          startConnecting(node.id, portEl.getAttribute('data-port'), e);
        });
      });

      el.addEventListener('mousedown', (e) => {
        if (e.button === 2) return;
        if (e.target.classList.contains('port-handle')) return;
        if (state.tool === 'pan' || state.spacePressed) return;

        e.stopPropagation();
        hideAllContextMenus();
        
        if (e.shiftKey) {
          if (state.selectedNodeIds.has(node.id)) state.selectedNodeIds.delete(node.id);
          else state.selectedNodeIds.add(node.id);
        } else {
          if (!state.selectedNodeIds.has(node.id)) {
            state.selectedNodeIds.clear();
            state.selectedNodeIds.add(node.id);
          }
        }

        state.selectedWireId = null;
        updateSelectionUI();

        state.isDraggingNode = true;
        state.dragStartPos = { x: e.clientX, y: e.clientY };
        state.nodesDragInitialPos.clear();
        state.selectedNodeIds.forEach(id => {
          const n = state.nodes.find(item => item.id === id);
          if (n) state.nodesDragInitialPos.set(id, { x: n.x, y: n.y });
        });
      });

      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        hideAllContextMenus();

        state.contextNodeId = node.id;
        state.selectedNodeIds.clear();
        state.selectedNodeIds.add(node.id);
        updateSelectionUI();

        const menu = dom.nodeContextMenu;
        menu.classList.remove('hidden');
        menu.style.left = `${Math.min(e.clientX, window.innerWidth - 240)}px`;
        menu.style.top = `${Math.min(e.clientY, window.innerHeight - 300)}px`;
      });
    }

    // --- WIRE RENDERING ---
    function calculateBezierPath(p1, p2, port1, port2) {
      const dx = Math.abs(p2.x - p1.x);
      const curvature = Math.max(dx * 0.5, 40);
      let c1 = { ...p1 }, c2 = { ...p2 };
      if (port1 === 'right') c1.x += curvature;
      else if (port1 === 'left') c1.x -= curvature;
      else if (port1 === 'bottom') c1.y += curvature;
      else if (port1 === 'top') c1.y -= curvature;

      if (port2 === 'left') c2.x -= curvature;
      else if (port2 === 'right') c2.x += curvature;
      else if (port2 === 'top') c2.y -= curvature;
      else if (port2 === 'bottom') c2.y += curvature;

      return `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
    }

    function calculateOrthogonalPath(p1, p2, port1, port2) {
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
      if (port1 === 'right' || port1 === 'left') {
        return `M ${p1.x} ${p1.y} L ${midX} ${p1.y} L ${midX} ${p2.y} L ${p2.x} ${p2.y}`;
      } else {
        return `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
      }
    }

    function renderWires() {
      dom.wiresGroup.innerHTML = '';

      state.wires.forEach(wire => {
        const fromNode = state.nodes.find(n => n.id === wire.fromNode);
        const toNode = state.nodes.find(n => n.id === wire.toNode);
        if (!fromNode || !toNode) return;

        const p1 = getNodePortCoord(fromNode, wire.fromPort || 'right');
        const p2 = getNodePortCoord(toNode, wire.toPort || 'left');

        let d = '';
        if (wire.style === 'orthogonal') d = calculateOrthogonalPath(p1, p2, wire.fromPort, wire.toPort);
        else if (wire.style === 'straight') d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
        else d = calculateBezierPath(p1, p2, wire.fromPort || 'right', wire.toPort || 'left');

        const isSelected = state.selectedWireId === wire.id;
        const wireColorHex = {
          cyan: '#38bdf8', purple: '#a855f7', emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e', slate: '#64748b'
        }[wire.color || 'cyan'] || '#38bdf8';

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('data-wire-id', wire.id);

        const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hitPath.setAttribute('d', d);
        hitPath.setAttribute('fill', 'none');
        hitPath.setAttribute('stroke', 'transparent');
        hitPath.setAttribute('stroke-width', '18');
        hitPath.style.cursor = 'pointer';

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', isSelected ? '#ffffff' : wireColorHex);
        path.setAttribute('stroke-width', isSelected ? '3.5' : '2.2');
        path.setAttribute('marker-end', `url(#arrow-${wire.color || 'cyan'})`);
        if (wire.animated) path.classList.add('wire-flow-anim');

        g.appendChild(hitPath);
        g.appendChild(path);

        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;

        if (wire.label || isSelected) {
          const textGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          textGroup.setAttribute('transform', `translate(${midX}, ${midY})`);
          textGroup.style.cursor = 'pointer';

          const labelText = wire.label || '关系';
          const labelWidth = Math.max(labelText.length * 12 + 18, 48);

          const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bgRect.setAttribute('x', -labelWidth / 2);
          bgRect.setAttribute('y', -11);
          bgRect.setAttribute('width', labelWidth);
          bgRect.setAttribute('height', 22);
          bgRect.setAttribute('rx', 11);
          bgRect.setAttribute('fill', '#12151f');
          bgRect.setAttribute('stroke', isSelected ? '#ffffff' : 'rgba(255,255,255,0.15)');
          bgRect.setAttribute('stroke-width', '1');

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('dominant-baseline', 'central');
          text.setAttribute('fill', isSelected ? '#ffffff' : '#cbd5e1');
          text.setAttribute('font-size', '10.5');
          text.setAttribute('font-weight', '500');
          text.textContent = labelText;

          textGroup.appendChild(bgRect);
          textGroup.appendChild(text);

          textGroup.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            promptEditWireLabel(wire);
          });
          g.appendChild(textGroup);
        }

        hitPath.addEventListener('click', (e) => {
          e.stopPropagation();
          state.selectedWireId = wire.id;
          state.selectedNodeIds.clear();
          updateSelectionUI();
        });

        hitPath.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          hideAllContextMenus();

          state.contextWireId = wire.id;
          state.selectedWireId = wire.id;
          state.selectedNodeIds.clear();
          updateSelectionUI();

          const menu = dom.wireContextMenu;
          menu.classList.remove('hidden');
          menu.style.left = `${Math.min(e.clientX, window.innerWidth - 220)}px`;
          menu.style.top = `${Math.min(e.clientY, window.innerHeight - 250)}px`;
        });

        dom.wiresGroup.appendChild(g);
      });
    }

    function promptEditWireLabel(wire) {
      const result = prompt("请输入连线关系文字（如：依赖、输入、派生、生成）：", wire.label || '');
      if (result !== null) {
        wire.label = result.trim();
        saveHistory();
        renderWires();
      }
    }

    function renderAll() {
      dom.nodesLayer.innerHTML = '';
      dom.framesLayer.innerHTML = '';

      state.nodes.forEach(node => {
        const el = createNodeElement(node);
        if (node.shape === 'frame') dom.framesLayer.appendChild(el);
        else dom.nodesLayer.appendChild(el);
      });

      renderWires();
      renderMinimap();
      lucide.createIcons();
      updateSelectionUI();
    }

    function updateViewportTransform() {
      dom.world.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      dom.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
      dom.container.style.backgroundPosition = `${state.panX}px ${state.panY}px`;
      dom.container.style.backgroundSize = `${32 * state.zoom}px ${32 * state.zoom}px`;
      renderMinimapViewport();
    }

    function updateSelectionUI() {
      state.nodes.forEach(node => {
        const el = document.getElementById(`node-${node.id}`);
        if (el) {
          if (state.selectedNodeIds.has(node.id)) el.classList.add('is-selected');
          else el.classList.remove('is-selected');
        }
      });
    }

    function hideAllContextMenus() {
      dom.canvasContextMenu.classList.add('hidden');
      dom.nodeContextMenu.classList.add('hidden');
      dom.wireContextMenu.classList.add('hidden');
      document.getElementById('templates-dropdown').classList.add('hidden');
    }

    // --- CONNECTING NODES ---
    function startConnecting(sourceNodeId, port, mouseEvent) {
      state.isConnecting = true;
      state.connectSourceNodeId = sourceNodeId;
      state.connectSourcePort = port;
      dom.container.classList.add('connecting');

      const sourceNode = state.nodes.find(n => n.id === sourceNodeId);
      const startCoord = getNodePortCoord(sourceNode, port);

      dom.tempDragWire.style.opacity = '1';
      dom.tempDragWire.setAttribute('d', `M ${startCoord.x} ${startCoord.y} L ${startCoord.x} ${startCoord.y}`);
    }

    function updateConnectingWire(screenX, screenY) {
      if (!state.isConnecting) return;
      const worldPos = screenToWorld(screenX, screenY);
      const sourceNode = state.nodes.find(n => n.id === sourceNodeId);
      if (!sourceNode) return;

      const p1 = getNodePortCoord(sourceNode, state.connectSourcePort);
      const d = calculateBezierPath(p1, worldPos, state.connectSourcePort, 'left');
      dom.tempDragWire.setAttribute('d', d);
    }

    function finishConnecting(targetNodeId, targetPort) {
      if (!state.isConnecting) return;
      
      if (targetNodeId && targetNodeId !== state.connectSourceNodeId) {
        state.wires.push({
          id: `w-${Date.now()}`,
          fromNode: state.connectSourceNodeId,
          fromPort: state.connectSourcePort,
          toNode: targetNodeId,
          toPort: targetPort || 'left',
          label: '',
          style: 'bezier',
          color: 'cyan',
          animated: true
        });
        saveHistory();
        renderWires();
      } else if (!targetNodeId) {
        const worldPos = screenToWorld(state.connectMousePos.x, state.connectMousePos.y);
        createAndConnectChild(state.connectSourceNodeId, snap(worldPos.x), snap(worldPos.y));
      }

      cancelConnecting();
    }

    function cancelConnecting() {
      state.isConnecting = false;
      state.connectSourceNodeId = null;
      dom.container.classList.remove('connecting');
      dom.tempDragWire.style.opacity = '0';
    }

    function createAndConnectChild(parentId, targetX, targetY) {
      const parent = state.nodes.find(n => n.id === parentId);
      if (!parent) return;

      const newId = `node-${Date.now()}`;

      const posY = targetY || (parent.y);

        id: `w-${Date.now()}`,
        fromNode: parent.id,
        fromPort: 'right',
        toNode: newNode.id,

      state.wires.push(newWire);

    function createSiblingNode(referenceId) {
      const ref = state.nodes.find(n => n.id === referenceId);
      if (!ref) return;

      const newId = `node-${Date.now()}`;
      const newNode = {
        id: newId,
        type: ref.type || 'card',
        shape: ref.shape || 'card',
        x: ref.x,
        y: ref.y + ref.height + 40,
        width: ref.width,
        height: ref.height,
        title: "同级要点",
        content: "内容描述...",
        color: ref.color || 'cyan',
        zIndex: 10
      };

      const incoming = state.wires.find(w => w.toNode === ref.id);
      if (incoming) {
        state.wires.push({
          id: `w-${Date.now()}`,
          fromNode: incoming.fromNode,
          fromPort: incoming.fromPort,
          toNode: newId,
          toPort: 'left',
          label: '',
          style: incoming.style || 'bezier',
          color: incoming.color || 'cyan',
          animated: incoming.animated
        });
      }

      state.nodes.push(newNode);
      state.selectedNodeIds.clear();
      state.selectedNodeIds.add(newId);

      saveHistory();
      renderAll();
    }

    function autoLayoutMindmap() {
      if (state.nodes.length === 0) return;

      const incomingMap = new Map();
      state.nodes.forEach(n => incomingMap.set(n.id, 0));
      state.wires.forEach(w => {
        incomingMap.set(w.toNode, (incomingMap.get(w.toNode) || 0) + 1);
      });

      let roots = state.nodes.filter(n => incomingMap.get(n.id) === 0);
      if (roots.length === 0) roots = [state.nodes[0]];

      const HORIZONTAL_GAP = 140;
      const VERTICAL_GAP = 40;
      let currentRootY = 150;

      roots.forEach(root => {
        function layoutSubtree(node, level, startY) {
          const childrenWires = state.wires.filter(w => w.fromNode === node.id);
          const children = childrenWires.map(w => state.nodes.find(n => n.id === w.toNode)).filter(Boolean);

          if (children.length === 0) {
            node.x = 100 + level * (260 + HORIZONTAL_GAP);
            node.y = startY;
            return { totalHeight: node.height + VERTICAL_GAP, centerY: startY + node.height / 2 };
          }

          let childY = startY;
          let firstChildCenter = 0, lastChildCenter = 0;

          children.forEach((child, index) => {
            const res = layoutSubtree(child, level + 1, childY);
            if (index === 0) firstChildCenter = res.centerY;
            if (index === children.length - 1) lastChildCenter = res.centerY;
            childY += res.totalHeight;
          });

          node.x = 100 + level * (260 + HORIZONTAL_GAP);
          node.y = (firstChildCenter + lastChildCenter) / 2 - node.height / 2;
          return { totalHeight: childY - startY, centerY: node.y + node.height / 2 };
        }

        const res = layoutSubtree(root, 0, currentRootY);
        currentRootY += res.totalHeight + 80;
      });

      saveHistory();
      renderAll();
      fitViewToNodes();
    }

    function fitViewToNodes() {
      if (state.nodes.length === 0) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + n.width);
        maxY = Math.max(maxY, n.y + n.height);
      });

      const padding = 100;
      const graphW = maxX - minX + padding * 2;
      const graphH = maxY - minY + padding * 2;
      const viewW = window.innerWidth, viewH = window.innerHeight;

      state.zoom = Math.min(Math.max(Math.min(viewW / graphW, viewH / graphH), 0.35), 1.2);
      state.panX = (viewW - (maxX + minX) * state.zoom) / 2;
      state.panY = (viewH - (maxY + minY) * state.zoom) / 2;

      updateViewportTransform();
      renderMinimap();
    }

    // --- MINIMAP ---
    function renderMinimap() {
      const canvas = dom.minimapCanvas;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      dom.minimapNodeCount.textContent = `${state.nodes.length} 个节点`;
      if (state.nodes.length === 0) return;

      let minX = -500, minY = -500, maxX = 2500, maxY = 1800;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x - 200);
        minY = Math.min(minY, n.y - 200);
        maxX = Math.max(maxX, n.x + n.width + 200);
        maxY = Math.max(maxY, n.y + n.height + 200);
      });

      const scale = Math.min(canvas.width / (maxX - minX), canvas.height / (maxY - minY));

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      state.wires.forEach(w => {
        const from = state.nodes.find(n => n.id === w.fromNode);
        const to = state.nodes.find(n => n.id === w.toNode);
        if (from && to) {
          ctx.beginPath();
          ctx.moveTo((from.x + from.width/2 - minX) * scale, (from.y + from.height/2 - minY) * scale);
          ctx.lineTo((to.x + to.width/2 - minX) * scale, (to.y + to.height/2 - minY) * scale);
          ctx.stroke();
        }
      });

      state.nodes.forEach(n => {
        const x = (n.x - minX) * scale, y = (n.y - minY) * scale;
        ctx.fillStyle = state.selectedNodeIds.has(n.id) ? '#ffffff' : 'rgba(255,255,255,0.35)';
        ctx.fillRect(x, y, Math.max(n.width * scale, 3), Math.max(n.height * scale, 2));
      });

      renderMinimapViewport();
    }

    function renderMinimapViewport() {
      const canvas = dom.minimapCanvas;
      if (state.nodes.length === 0) return;

      let minX = -500, minY = -500, maxX = 2500, maxY = 1800;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x - 200);
        minY = Math.min(minY, n.y - 200);
        maxX = Math.max(maxX, n.x + n.width + 200);
        maxY = Math.max(maxY, n.y + n.height + 200);
      });

      const scale = Math.min(canvas.width / (maxX - minX), canvas.height / (maxY - minY));
      const viewWorldTopLeft = screenToWorld(0, 0);
      const viewWorldBottomRight = screenToWorld(window.innerWidth, window.innerHeight);

      const vx = (viewWorldTopLeft.x - minX) * scale;
      const vy = (viewWorldTopLeft.y - minY) * scale;
      const vw = (viewWorldBottomRight.x - viewWorldTopLeft.x) * scale;
      const vh = (viewWorldBottomRight.y - viewWorldTopLeft.y) * scale;

      dom.minimapViewportBox.style.left = `${Math.max(0, vx)}px`;
      dom.minimapViewportBox.style.top = `${Math.max(0, vy)}px`;
      dom.minimapViewportBox.style.width = `${Math.min(canvas.width, vw)}px`;
      dom.minimapViewportBox.style.height = `${Math.min(canvas.height, vh)}px`;
    }

    // --- EXPORT ---
    async function executeExport(format, scaleFactor = 2, bgChoice = 'dark') {
      if (format === 'json') {
        const data = {
          id: state.projectId,
          projectTitle: state.projectTitle,
          nodes: state.nodes,
          wires: state.wires
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        downloadBlob(blob, `${state.projectTitle}.json`);
        return;
      }

      if (format === 'svg') {
        exportAsSVG();
        return;
      }

      await exportAsHighResPNG(scaleFactor, bgChoice);
    }

    async function exportAsHighResPNG(scale = 2, bgChoice = 'dark') {
      if (state.nodes.length === 0) return alert("画布上没有节点！");

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + n.width);
        maxY = Math.max(maxY, n.y + n.height);
      });

      const padding = 80;
      minX -= padding; minY -= padding; maxX += padding; maxY += padding;
      const width = maxX - minX, height = maxY - minY;

      const prevPanX = state.panX, prevPanY = state.panY, prevZoom = state.zoom;
      state.panX = -minX; state.panY = -minY; state.zoom = 1;
      updateViewportTransform();

      let bgColor = bgChoice === 'white' ? '#ffffff' : (bgChoice === 'transparent' ? null : '#08090d');

      try {
        const canvas = await html2canvas(dom.world, {
          scale: scale,
          backgroundColor: bgColor,
          x: 0, y: 0, width: width, height: height,
          logging: false, useCORS: true
        });
        canvas.toBlob((blob) => {
          downloadBlob(blob, `${state.projectTitle}_${scale}x.png`);
        }, 'image/png');
      } catch (err) {
        alert("导出失败，请重试！");
      } finally {
        state.panX = prevPanX; state.panY = prevPanY; state.zoom = prevZoom;
        updateViewportTransform();
      }
    }

    function exportAsSVG() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      state.nodes.forEach(n => {
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + n.width); maxY = Math.max(maxY, n.y + n.height);
      });

      const padding = 60;
      minX -= padding; minY -= padding; maxX += padding; maxY += padding;
      const width = maxX - minX, height = maxY - minY;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}">\n`;
      svg += `<rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="#08090d"/>\n`;

      state.wires.forEach(w => {
        const from = state.nodes.find(n => n.id === w.fromNode);
        const to = state.nodes.find(n => n.id === w.toNode);
        if (from && to) {
          const p1 = getNodePortCoord(from, w.fromPort || 'right');
          const p2 = getNodePortCoord(to, w.toPort || 'left');
          const d = calculateBezierPath(p1, p2, w.fromPort, w.toPort);
          svg += `<path d="${d}" fill="none" stroke="#38bdf8" stroke-width="2.5" />\n`;
        }
      });

      state.nodes.forEach(n => {
        svg += `<rect x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="14" fill="#161922" stroke="#38bdf8" stroke-width="1.5"/>\n`;
        svg += `<text x="${n.x + 16}" y="${n.y + 28}" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">${escapeXml(n.title)}</text>\n`;
        if (n.content) svg += `<text x="${n.x + 16}" y="${n.y + 54}" fill="#94a3b8" font-family="sans-serif" font-size="11">${escapeXml(n.content.slice(0, 40))}</text>\n`;
      });
      svg += `</svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml' });
      downloadBlob(blob, `${state.projectTitle}.svg`);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '\'': '&apos;', '"': '&quot;' }[c]));
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- EVENT LISTENERS & CONTEXT MENUS ---
    function setupGlobalEvents() {
      window.addEventListener('resize', renderMinimap);
      window.addEventListener('click', hideAllContextMenus);

      // Back to Hub: flush save and return
      document.getElementById('btn-back-hub').addEventListener('click', () => {
        performSave();
        window.location.href = 'index.html';
      });

      // Manual Save Button
      document.getElementById('btn-manual-save').addEventListener('click', () => {
        performSave();
        alert("工程已保存至项目中心！");
      });

      // Mouse Move
      window.addEventListener('mousemove', (e) => {
        state.connectMousePos = { x: e.clientX, y: e.clientY };

        if (state.isConnecting) {
          updateConnectingWire(e.clientX, e.clientY);
          return;
        }

        if (state.isPanning) {
          state.panX += e.clientX - state.panStartX;
          state.panY += e.clientY - state.panStartY;
          state.panStartX = e.clientX;
          state.panStartY = e.clientY;
          updateViewportTransform();
          return;
        }

        if (state.isDraggingNode) {
          const dx = (e.clientX - state.dragStartPos.x) / state.zoom;
          const dy = (e.clientY - state.dragStartPos.y) / state.zoom;

          state.selectedNodeIds.forEach(id => {
            const initPos = state.nodesDragInitialPos.get(id);
            const node = state.nodes.find(n => n.id === id);
            if (node && initPos) {
              node.x = snap(initPos.x + dx);
              node.y = snap(initPos.y + dy);
              const el = document.getElementById(`node-${node.id}`);
              if (el) { el.style.left = `${node.x}px`; el.style.top = `${node.y}px`; }
            }
          });
          renderWires();
          renderMinimap();
          return;
        }

        if (state.isMarquee) {
          const x1 = Math.min(state.marqueeStart.x, e.clientX);
          const y1 = Math.min(state.marqueeStart.y, e.clientY);
          const x2 = Math.max(state.marqueeStart.x, e.clientX);
          const y2 = Math.max(state.marqueeStart.y, e.clientY);

          dom.selectionMarquee.style.display = 'block';
          dom.selectionMarquee.style.left = `${x1}px`;
          dom.selectionMarquee.style.top = `${y1}px`;
          dom.selectionMarquee.style.width = `${x2 - x1}px`;
          dom.selectionMarquee.style.height = `${y2 - y1}px`;

          const w1 = screenToWorld(x1, y1);
          const w2 = screenToWorld(x2, y2);

          state.selectedNodeIds.clear();
          state.nodes.forEach(n => {
            if (n.x + n.width >= w1.x && n.x <= w2.x && n.y + n.height >= w1.y && n.y <= w2.y) {
              state.selectedNodeIds.add(n.id);
            }
          });
          updateSelectionUI();
        }
      });

      // Mouse Up
      window.addEventListener('mouseup', (e) => {
        if (state.isConnecting) {
          const portEl = e.target.closest('.port-handle');
          const nodeEl = e.target.closest('.canvas-node');
          if (portEl && nodeEl) {
            finishConnecting(nodeEl.id.replace('node-', ''), portEl.getAttribute('data-port'));
          } else if (nodeEl) {
            finishConnecting(nodeEl.id.replace('node-', ''), 'left');
          } else {
            finishConnecting(null, null);
          }
        }
        if (state.isPanning) state.isPanning = false;
        if (state.isDraggingNode) { state.isDraggingNode = false; saveHistory(); }
        if (state.isMarquee) { state.isMarquee = false; dom.selectionMarquee.style.display = 'none'; }
      });

      // Canvas Container Mousedown
      dom.container.addEventListener('mousedown', (e) => {
        if (e.target !== dom.container && e.target !== dom.world && e.target.id !== 'svg-connections-layer') return;
        hideAllContextMenus();

        if (state.spacePressed || e.button === 1 || state.tool === 'pan') {
          state.isPanning = true;
          state.panStartX = e.clientX;
          state.panStartY = e.clientY;
          return;
        }

        if (e.button === 0) {
          state.selectedNodeIds.clear();
          state.selectedWireId = null;
          updateSelectionUI();
          state.isMarquee = true;
          state.marqueeStart = { x: e.clientX, y: e.clientY };
        }
      });

      // Blank Canvas Right Click Menu
      dom.container.addEventListener('contextmenu', (e) => {
        if (e.target !== dom.container && e.target !== dom.world && e.target.id !== 'svg-connections-layer') return;
        e.preventDefault();
        e.stopPropagation();
        hideAllContextMenus();

        state.contextClickWorldPos = screenToWorld(e.clientX, e.clientY);

        const menu = dom.canvasContextMenu;
        menu.classList.remove('hidden');
        menu.style.left = `${Math.min(e.clientX, window.innerWidth - 240)}px`;
        menu.style.top = `${Math.min(e.clientY, window.innerHeight - 340)}px`;
      });

      document.querySelectorAll('[data-create-ctx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const shape = btn.getAttribute('data-create-ctx');
          createNodeAtWorldPos(shape, snap(state.contextClickWorldPos.x), snap(state.contextClickWorldPos.y));
          hideAllContextMenus();
        });
      });

      document.getElementById('ctx-btn-auto-layout').addEventListener('click', () => {
        autoLayoutMindmap();
        hideAllContextMenus();
      });
      document.getElementById('ctx-btn-fit-view').addEventListener('click', () => {
        fitViewToNodes();
        hideAllContextMenus();
      });

      // Node Context Menu actions
      document.getElementById('node-ctx-add-child').addEventListener('click', () => {
        if (state.contextNodeId) createAndConnectChild(state.contextNodeId);
        hideAllContextMenus();
      });
      document.getElementById('node-ctx-add-sibling').addEventListener('click', () => {
        if (state.contextNodeId) createSiblingNode(state.contextNodeId);
        hideAllContextMenus();
      });
      document.getElementById('node-ctx-duplicate').addEventListener('click', () => {
        duplicateSelectedNodes();
        hideAllContextMenus();
      });
      document.getElementById('node-ctx-bring-front').addEventListener('click', () => {
        const node = state.nodes.find(n => n.id === state.contextNodeId);
        if (node) { node.zIndex = (Math.max(...state.nodes.map(n => n.zIndex || 10)) || 10) + 1; renderAll(); saveHistory(); }
        hideAllContextMenus();
      });
      document.getElementById('node-ctx-delete').addEventListener('click', () => {
        if (state.contextNodeId) {
          state.nodes = state.nodes.filter(n => n.id !== state.contextNodeId);
          state.wires = state.wires.filter(w => w.fromNode !== state.contextNodeId && w.toNode !== state.contextNodeId);
          state.selectedNodeIds.clear();
          saveHistory(); renderAll();
        }
        hideAllContextMenus();
      });

      document.querySelectorAll('[data-node-shape]').forEach(btn => {
        btn.addEventListener('click', () => {
          const shape = btn.getAttribute('data-node-shape');
          const node = state.nodes.find(n => n.id === state.contextNodeId);
          if (node) { node.shape = shape; node.type = shape; renderAll(); saveHistory(); }
          hideAllContextMenus();
        });
      });

      document.querySelectorAll('[data-node-color]').forEach(btn => {
        btn.addEventListener('click', () => {
          const color = btn.getAttribute('data-node-color');
          const node = state.nodes.find(n => n.id === state.contextNodeId);
          if (node) { node.color = color; renderAll(); saveHistory(); }
          hideAllContextMenus();
        });
      });

      // Wire Context Menu actions
      document.getElementById('wire-ctx-edit-label').addEventListener('click', () => {
        const wire = state.wires.find(w => w.id === state.contextWireId);
        if (wire) promptEditWireLabel(wire);
        hideAllContextMenus();
      });
      document.querySelectorAll('[data-wire-style-ctx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const style = btn.getAttribute('data-wire-style-ctx');
          const wire = state.wires.find(w => w.id === state.contextWireId);
          if (wire) { wire.style = style; saveHistory(); renderWires(); }
          hideAllContextMenus();
        });
      });
      document.getElementById('wire-ctx-toggle-anim').addEventListener('click', () => {
        const wire = state.wires.find(w => w.id === state.contextWireId);
        if (wire) { wire.animated = !wire.animated; saveHistory(); renderWires(); }
        hideAllContextMenus();
      });
      document.getElementById('wire-ctx-delete').addEventListener('click', () => {
        if (state.contextWireId) {
          state.wires = state.wires.filter(w => w.id !== state.contextWireId);
          state.selectedWireId = null;
          saveHistory(); renderAll();
        }
        hideAllContextMenus();
      });

      // Zoom Wheel
      dom.viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey || !state.spacePressed) {
          const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
          const newZoom = Math.min(Math.max(state.zoom * zoomFactor, 0.15), 3.0);
          const rect = dom.viewport.getBoundingClientRect();
          const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
          state.panX = mouseX - (mouseX - state.panX) * (newZoom / state.zoom);
          state.panY = mouseY - (mouseY - state.panY) * (newZoom / state.zoom);
          state.zoom = newZoom;
          updateViewportTransform();
        } else {
          state.panX -= e.deltaX; state.panY -= e.deltaY;
          updateViewportTransform();
        }
      }, { passive: false });

      // Keyboard
      window.addEventListener('keydown', (e) => {
        const isEditing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;
        if (e.code === 'Space' && !isEditing && !state.spacePressed) {
          state.spacePressed = true; dom.container.classList.add('tool-pan');
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          performSave();
          return;
        }
        if (isEditing) return;

        if (e.key === 'Tab') {
          e.preventDefault();
          if (state.selectedNodeIds.size === 1) createAndConnectChild(Array.from(state.selectedNodeIds)[0]);
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (state.selectedNodeIds.size === 1) createSiblingNode(Array.from(state.selectedNodeIds)[0]);
        }
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (state.selectedNodeIds.size > 0) {
            state.nodes = state.nodes.filter(n => !state.selectedNodeIds.has(n.id));
            state.wires = state.wires.filter(w => !state.selectedNodeIds.has(w.fromNode) && !state.selectedNodeIds.has(w.toNode));
            state.selectedNodeIds.clear(); saveHistory(); renderAll();
          } else if (state.selectedWireId) {
            state.wires = state.wires.filter(w => w.id !== state.selectedWireId);
            state.selectedWireId = null; saveHistory(); renderAll();
          }
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateSelectedNodes(); }
        if (e.key === 'v' || e.key === 'V') setTool('select');
        if (e.key === 'h' || e.key === 'H') setTool('pan');
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          state.spacePressed = false;
          if (state.tool !== 'pan') dom.container.classList.remove('tool-pan');
        }
      });

      // Dock buttons
      document.querySelectorAll('.dock-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tool = btn.getAttribute('data-tool');
          const createShape = btn.getAttribute('data-create');
          if (tool) {
            setTool(tool);
            document.querySelectorAll('.dock-tool-btn').forEach(b => b.classList.remove('active', 'bg-white/15', 'text-white'));
            btn.classList.add('active', 'bg-white/15', 'text-white');
          } else if (createShape) {
            createNodeAtWorldPos(createShape, screenToWorld(window.innerWidth/2, window.innerHeight/2).x, screenToWorld(window.innerWidth/2, window.innerHeight/2).y);
          }
        });
      });

      document.getElementById('btn-add-mind-branch').addEventListener('click', () => {
        if (state.selectedNodeIds.size === 1) createAndConnectChild(Array.from(state.selectedNodeIds)[0]);
        else if (state.nodes.length > 0) createAndConnectChild(state.nodes[0].id);
      });

      document.getElementById('btn-undo').addEventListener('click', undo);
      document.getElementById('btn-redo').addEventListener('click', redo);
      document.getElementById('btn-auto-layout').addEventListener('click', autoLayoutMindmap);
      document.getElementById('btn-zoom-in').addEventListener('click', () => { state.zoom = Math.min(state.zoom * 1.2, 3.0); updateViewportTransform(); });
      document.getElementById('btn-zoom-out').addEventListener('click', () => { state.zoom = Math.max(state.zoom * 0.8, 0.15); updateViewportTransform(); });
      document.getElementById('btn-fit-view').addEventListener('click', fitViewToNodes);

      dom.projectTitleInput.addEventListener('input', () => {
        state.projectTitle = dom.projectTitleInput.value.trim() || "思维导图";
        triggerAutoSave();
      });

      // Templates dropdown
      const tplToggle = document.getElementById('btn-templates-toggle');
      const tplDropdown = document.getElementById('templates-dropdown');
      tplToggle.addEventListener('click', (e) => { e.stopPropagation(); tplDropdown.classList.toggle('hidden'); });
      document.querySelectorAll('[data-template]').forEach(btn => {
        btn.addEventListener('click', () => { loadTemplate(btn.getAttribute('data-template')); });
      });

      // Export modal
      let exportFormat = 'png', exportScale = 2, exportBg = 'dark';
      document.getElementById('btn-open-export').addEventListener('click', () => dom.exportModal.classList.remove('hidden'));
      document.getElementById('btn-close-export').addEventListener('click', () => dom.exportModal.classList.add('hidden'));
      document.getElementById('btn-cancel-export').addEventListener('click', () => dom.exportModal.classList.add('hidden'));

      document.querySelectorAll('.export-format-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.export-format-btn').forEach(b => {
            b.classList.remove('active', 'border-white/30', 'bg-white/10', 'text-white');
            b.classList.add('border-white/10', 'bg-white/5', 'text-slate-300');
          });
          btn.classList.add('active', 'border-white/30', 'bg-white/10', 'text-white');
          exportFormat = btn.getAttribute('data-export-format');
          document.getElementById('png-options-group').style.display = exportFormat === 'png' ? 'block' : 'none';
          document.getElementById('export-btn-label').textContent = exportFormat === 'png' ? '立即下载 PNG 图片' : (exportFormat === 'svg' ? '导出 SVG 矢量' : '下载 JSON 存档');
        });
      });

      document.querySelectorAll('.png-scale-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.png-scale-btn').forEach(b => b.classList.remove('active', 'border-white/30', 'bg-white/15', 'text-white', 'font-semibold'));
          btn.classList.add('active', 'border-white/30', 'bg-white/15', 'text-white', 'font-semibold');
          exportScale = parseInt(btn.getAttribute('data-png-scale'));
        });
      });

      document.querySelectorAll('.png-bg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.png-bg-btn').forEach(b => b.classList.remove('active', 'border-white/30', 'bg-white/15', 'text-white'));
          btn.classList.add('active', 'border-white/30', 'bg-white/15', 'text-white');
          exportBg = btn.getAttribute('data-png-bg');
        });
      });

      document.getElementById('btn-execute-export').addEventListener('click', async () => {
        dom.exportModal.classList.add('hidden');
        await executeExport(exportFormat, exportScale, exportBg);
      });
    }

    function setTool(tool) {
      state.tool = tool;
      dom.container.classList.remove('tool-select', 'tool-pan');
      dom.container.classList.add(`tool-${tool}`);
    }

    function createNodeAtWorldPos(shape, posX, posY) {
      const newId = `node-${Date.now()}`;
      let width = 240, height = 140, title = "新主题卡片", content = "双击编辑内容...", color = "cyan";

      if (shape === 'circle') { width = 200; height = 160; title = "思维原点"; }
      else if (shape === 'diamond') { width = 200; height = 180; title = "决策条件？"; color = "amber"; }
      else if (shape === 'sticky') { width = 200; height = 160; title = "便签要点"; color = "amber"; }
      else if (shape === 'pill') { width = 180; height = 50; title = "标签关键词"; color = "rose"; }
      else if (shape === 'frame') { width = 500; height = 360; title = "分组框架"; color = "slate"; }
      else if (shape === 'ai_prompt') { width = 300; height = 180; title = "创作节点"; content = "输入生成提示词与参数..."; color = "purple"; }

      const newNode = {
        id: newId,
        type: shape,
        shape: shape,
        x: snap(posX - width / 2),
        y: snap(posY - height / 2),
        width: width,
        height: height,
        title: title,
        content: content,
        color: color,
        zIndex: 10
      };

      state.nodes.push(newNode);
      state.selectedNodeIds.clear();
      state.selectedNodeIds.add(newId);
      saveHistory();
      renderAll();
    }

    function duplicateSelectedNodes() {
      if (state.selectedNodeIds.size === 0) return;
      const newIds = new Set();
      state.selectedNodeIds.forEach(id => {
        const orig = state.nodes.find(n => n.id === id);
        if (orig) {
          const cloneId = `node-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`;
          state.nodes.push({ ...orig, id: cloneId, x: orig.x + 40, y: orig.y + 40, title: `${orig.title} (副本)` });
          newIds.add(cloneId);
        }
      });
      state.selectedNodeIds = newIds;
      saveHistory();
      renderAll();
    }

    function loadTemplate(templateKey) {
      const tpl = TEMPLATES[templateKey];
      if (tpl) {
        state.projectTitle = tpl.title;
        dom.projectTitleInput.value = tpl.title;
        state.nodes = JSON.parse(JSON.stringify(tpl.nodes));
        state.wires = JSON.parse(JSON.stringify(tpl.wires));
        state.selectedNodeIds.clear();
        state.selectedWireId = null;
        saveHistory();
        renderAll();
        fitViewToNodes();
        performSave();
      }
    }

    function init() {
      const loaded = loadFromStorage();
      if (!loaded) loadTemplate('creative_pipeline');
      else { saveHistory(); renderAll(); fitViewToNodes(); }
      setupGlobalEvents();
      updateViewportTransform();
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
