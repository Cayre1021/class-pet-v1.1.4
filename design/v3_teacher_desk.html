<!doctype html>
<html lang="zh-CN" data-theme="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>班级电子宠物 · 教师操作台 V3</title>
<style>
/* ============================================================
   V3 · 教师操作台 —— token 与三级边框制（与 v3_student_stage 同源）
   ============================================================ */
:root{
  --paper:#F4F3EF; --canvas:#FAF9F5; --surface:#FFFFFF; --surface-2:#FBF9F4;
  --ink:#111111; --ink-2:#555555; --ink-3:#8A8A86;
  --accent:#267853; --accent-ink:#FFFFFF; --accent-soft:#DFF3E7;
  --sun:#FFD45E; --mint:#72C59A; --sky:#82B8F5; --coral:#FF8D78;
  --sub-yuwen:#FF8D78; --sub-shuxue:#82B8F5; --sub-yingyu:#FFD45E;
  --line:2px; --line-soft:1.5px;
  --r-card:14px; --r-btn:10px; --r-pill:999px;
  --shadow-pop:0 4px 0 var(--ink);
  --shadow-soft:0 10px 30px rgba(17,17,17,.10);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px; --s8:56px;
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:24px; --t-3xl:28px; --t-name:22px;
  --stu-scale:1.2;
  --batch-h:0px;
}
html[data-theme="orange"]{ --accent:#B84B1B; --accent-soft:#FBE3D6; --paper:#FBF3EA; --canvas:#FDF8F2; }
html[data-theme="forest"]{ --accent:#267853; --accent-soft:#DFF3E7; --paper:#EFF6EF; --canvas:#F6FBF6; }
html[data-theme="ocean"]{ --accent:#2869A6; --accent-soft:#DEEBF8; --paper:#EEF5FB; --canvas:#F7FBFE; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:var(--t-md); line-height:1.45; color:var(--ink);
  background:var(--paper); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color 160ms ease;
}
button,input,select{font-family:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
::selection{background:var(--accent-soft);color:var(--ink)}

/* 滚动条：可见，不压内容 */
.lane-body::-webkit-scrollbar,.dock-scroll::-webkit-scrollbar,.dlg-body::-webkit-scrollbar{width:10px;height:10px}
.lane-body::-webkit-scrollbar-track,.dock-scroll::-webkit-scrollbar-track,.dlg-body::-webkit-scrollbar-track{background:transparent}
.lane-body::-webkit-scrollbar-thumb,.dock-scroll::-webkit-scrollbar-thumb,.dlg-body::-webkit-scrollbar-thumb{
  background:rgba(17,17,17,.22);border-radius:99px;border:3px solid var(--surface)
}
.lane-body:hover::-webkit-scrollbar-thumb,.dock-scroll:hover::-webkit-scrollbar-thumb{background:rgba(17,17,17,.38)}

/* ============================== 应用骨架 ============================== */
.app{
  height:100vh; height:100dvh; display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:72px 52px 44px minmax(0,1fr) auto;
  overflow:hidden;
}

/* ============================== 顶栏 72px ============================== */
.topbar{
  display:flex; align-items:center; gap:var(--s4); min-width:0; overflow:hidden;
  padding:0 var(--s5); background:var(--surface);
  border-bottom:var(--line) solid var(--ink);
  position:relative; z-index:30;
}
.btn{
  height:40px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:var(--line-soft) solid var(--ink); border-radius:var(--r-btn);
  background:var(--surface); color:var(--ink); font-size:var(--t-md); font-weight:700;
  text-decoration:none; white-space:nowrap; transition:background-color 120ms ease, transform 80ms ease, box-shadow 120ms ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px); box-shadow:none}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--ink)}
.btn-primary:hover{background:var(--accent); filter:brightness(1.06)}
.btn-sm{height:32px; padding:0 10px; font-size:var(--t-sm); border-radius:8px}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--surface-2)}

.portal-btn{gap:8px; padding:0 12px}
.portal-btn .arrow{font-size:16px;line-height:1;font-weight:800}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-paw{
  width:38px;height:38px;flex:none;border:var(--line-soft) solid var(--ink);border-radius:12px;
  background:var(--accent-soft); display:grid;place-items:center;
}
.brand-paw svg{width:22px;height:22px}
.brand h1{
  margin:0; font-size:var(--t-lg); font-weight:800; letter-spacing:.2px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.brand h1 .sep{color:var(--ink-3); font-weight:700; margin:0 2px}
.class-chip{
  height:28px; padding:0 10px; display:inline-flex;align-items:center; gap:6px;
  border:var(--line-soft) solid var(--ink); border-radius:var(--r-pill);
  font-size:var(--t-sm); font-weight:700; white-space:nowrap; background:var(--surface-2);
}
.class-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);border:1px solid var(--ink)}
.demo-badge{
  height:26px; padding:0 10px; display:inline-flex; align-items:center; gap:6px;
  border:var(--line-soft) dashed var(--accent); border-radius:var(--r-pill);
  background:var(--accent-soft); color:var(--accent); font-size:var(--t-xs); font-weight:800; letter-spacing:.04em;
  white-space:nowrap;
}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px; position:relative; flex:none}
.menu-wrap{position:relative}

/* ============================== 菜单（数据与设置 / 行操作） ============================== */
.menu{
  position:fixed; z-index:45; min-width:236px; padding:6px; margin:0;
  background:var(--surface); border:var(--line) solid var(--ink); border-radius:12px;
  box-shadow:var(--shadow-soft); list-style:none;
}
.menu-item{
  width:100%; min-height:40px; padding:8px 10px; display:flex; align-items:center; gap:10px;
  border:0; border-radius:8px; background:transparent; color:var(--ink);
  font-size:var(--t-md); font-weight:700; text-align:left;
}
.menu-item:hover,.menu-item:focus-visible{background:var(--accent-soft); outline:none}
.menu-item .mi-icon{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.menu-item .mi-icon svg{width:17px;height:17px}
.menu-item .mi-sub{margin-left:auto; font-size:var(--t-xs); color:var(--ink-3); font-weight:700}
.menu-sep{height:1px;margin:6px 8px;background:rgba(17,17,17,.12)}
.menu-title{padding:6px 10px 8px; font-size:var(--t-xs); color:var(--ink-3); font-weight:800; letter-spacing:.08em}
.row-menu{min-width:172px}
.row-menu .menu-item{min-height:38px}
.row-menu .menu-item .mi-icon{color:var(--ink-2)}

/* ============================== 第二行：学科 / 组 / 搜索 / 新增 ============================== */
.toolbar{
  display:flex; align-items:center; gap:var(--s4); padding:0 var(--s5);
  background:var(--surface); border-bottom:1px solid rgba(17,17,17,.12);
  position:relative; z-index:25; min-width:0; overflow:hidden;
}
.seg{
  display:inline-flex; align-items:center; gap:2px; padding:3px; flex:none;
  border:var(--line-soft) solid var(--ink); border-radius:12px; background:var(--surface-2);
}
.seg button{
  height:32px; min-width:56px; padding:0 12px; border:0; border-radius:8px;
  background:transparent; color:var(--ink-2); font-size:var(--t-md); font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:background-color 120ms ease,color 120ms ease;
}
.seg button:hover{background:rgba(17,17,17,.05); color:var(--ink)}
.seg button[aria-pressed="true"],.seg button.is-on{background:var(--accent); color:var(--accent-ink)}
.seg.seg-ink button[aria-pressed="true"],.seg.seg-ink button.is-on{background:var(--ink); color:var(--canvas)}
.seg button .sub-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.seg button[aria-pressed="true"] .sub-dot{border-color:var(--accent-ink)}
.seg button .seg-count{font-size:11px;font-weight:800;opacity:.72}
.toolbar-sep{width:1px;height:26px;background:rgba(17,17,17,.14)}
.search{
  display:flex; align-items:center; gap:8px; height:40px; padding:0 10px;
  border:var(--line-soft) solid var(--ink); border-radius:var(--r-btn); background:var(--surface);
  width:236px; flex:0 1 236px; min-width:120px;
}
.search:focus-within{box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:var(--t-md);font-weight:600;color:var(--ink)}
.search input::placeholder{color:var(--ink-3);font-weight:600}
.search-clear{
  width:24px;height:24px;border:0;border-radius:50%;background:rgba(17,17,17,.08);
  color:var(--ink-2);font-size:14px;line-height:1;display:grid;place-items:center;flex:none;
}
.search-clear:hover{background:rgba(17,17,17,.16)}
.kbd-hint{margin-left:auto; font-size:var(--t-xs); color:var(--ink-3); font-weight:700; display:flex; gap:10px; white-space:nowrap; min-width:0; overflow:hidden; flex:0 1 auto}
.kbd-hint kbd{
  font-family:inherit; font-size:11px; font-weight:800; padding:1px 6px; margin-right:2px;
  border:1px solid rgba(17,17,17,.22); border-bottom-width:2px; border-radius:5px; background:var(--surface);
  color:var(--ink-2);
}

/* ============================== 泳道工具条 44px ============================== */
.lane-strip{
  display:flex; align-items:center; gap:var(--s3); padding:0 var(--s5);
  background:var(--surface); border-bottom:1px solid rgba(17,17,17,.12);
  position:relative; z-index:24; min-width:0; overflow:hidden;
}
.strip-title{font-size:var(--t-sm); font-weight:800; letter-spacing:.02em; white-space:nowrap}
.strip-hint{font-size:var(--t-xs); color:var(--ink-3); font-weight:700; white-space:nowrap}
.strip-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex:none}
.mini-label{font-size:var(--t-xs); color:var(--ink-3); font-weight:800; white-space:nowrap}
.zoom{display:flex; align-items:center; gap:4px}
.zoom button{
  width:30px;height:30px;border:var(--line-soft) solid var(--ink);border-radius:8px;background:var(--surface);
  font-size:14px;font-weight:800;display:grid;place-items:center;line-height:1;
}
.zoom button:hover{background:var(--surface-2)}
.zoom output{min-width:46px;text-align:center;font-size:var(--t-sm);font-weight:800}

/* ============================== 主体 ============================== */
.main{
  display:grid; grid-template-columns:minmax(0,1fr) 380px;
  min-height:0; overflow:hidden; background:var(--paper);
}
.lanes{
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px;
  padding:16px 20px 20px; min-height:0; overflow:hidden;
}
.lanes.is-single{grid-template-columns:minmax(0,1fr)}
.lane{
  display:flex; flex-direction:column; min-height:0; min-width:0;
  border:var(--line) solid var(--ink); border-radius:var(--r-card);
  background:var(--surface); overflow:hidden;
}
.lane.is-collapsed .lane-rows{display:none}
.lane-head{
  position:sticky; top:0; z-index:6; flex:none;
  display:flex; align-items:center; gap:8px; padding:10px 10px 9px;
  background:var(--surface-2); border-bottom:var(--line-soft) solid var(--ink);
  min-width:0;
}
.lane-badge{
  width:26px;height:26px;flex:none;border:var(--line-soft) solid var(--ink); border-radius:8px;
  display:grid;place-items:center; font-size:12px; font-weight:900;
}
.lane-name{font-size:var(--t-md); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lane-meta{font-size:var(--t-xs); color:var(--ink-3); font-weight:700; white-space:nowrap}
.lane-exp{font-size:var(--t-xs); font-weight:800; color:var(--ink-2); white-space:nowrap}
.lane-exp b{font-size:var(--t-sm); color:var(--ink)}
.lane-collapse{
  width:30px;height:30px;flex:none;margin-left:auto;border:var(--line-soft) solid var(--ink);border-radius:8px;
  background:var(--surface); display:grid;place-items:center;
}
.lane-collapse svg{width:14px;height:14px;transition:transform 200ms ease}
.lane.is-collapsed .lane-collapse svg{transform:rotate(-90deg)}
.lane-collapse:hover{background:var(--accent-soft)}
.lane-body{
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:block;
}
.lane-sticky{position:sticky; top:0; z-index:6; background:var(--surface-2)}
.lane-rows{padding:8px; display:flex; flex-direction:column; gap:var(--s2)}
.lane-expbar{height:3px;background:rgba(17,17,17,.10)}
.lane-expbar span{display:block;height:100%;background:var(--accent); transition:width 260ms ease}
.lane-empty{
  margin:10px; padding:18px 12px; border:var(--line-soft) dashed rgba(17,17,17,.28); border-radius:10px;
  text-align:center; font-size:var(--t-sm); color:var(--ink-3); font-weight:700; line-height:1.7;
}

/* ---------- 学生行 ---------- */
.stu-row{
  --row-h:calc(56px * var(--stu-scale));
  position:relative; display:grid;
  grid-template-columns:20px 36px minmax(0,1fr) 40px;
  grid-template-rows:auto auto;
  align-items:center; column-gap:8px; row-gap:2px;
  min-height:var(--row-h); padding:8px 8px 8px 10px;
  border:var(--line-soft) solid transparent; border-radius:10px; background:var(--surface);
  transition:background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  cursor:pointer; min-width:0;
}
.stu-row:hover{background:var(--surface-2); border-color:rgba(17,17,17,.16); transform:translateY(-1px); box-shadow:0 2px 0 rgba(17,17,17,.08); z-index:11}
.stu-row:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
.stu-row.is-selected{
  background:var(--accent-soft); border-color:var(--ink);
  box-shadow:0 2px 0 var(--ink); z-index:10;
}
.stu-row.is-absent{opacity:.72}
.stu-row.is-absent .stu-name{text-decoration:line-through; text-decoration-color:rgba(17,17,17,.35)}
.stu-row.is-max{background:linear-gradient(0deg,rgba(255,212,94,.20),rgba(255,212,94,.20)),var(--surface)}
.stu-row.is-max.is-selected{background:linear-gradient(0deg,rgba(255,212,94,.30),rgba(255,212,94,.30)),var(--accent-soft)}
.chk{display:grid;place-items:center;width:20px;height:20px;position:relative}
.chk input{position:absolute;inset:0;width:20px;height:20px;margin:0;opacity:0;cursor:pointer;z-index:2}
.chk-box{
  width:18px;height:18px;border:var(--line-soft) solid var(--ink);border-radius:5px;background:var(--surface);
  display:grid;place-items:center;transition:background-color 120ms ease,border-color 120ms ease;
}
.chk-box svg{width:12px;height:12px;color:var(--accent-ink);opacity:0;transition:opacity 120ms ease}
.chk input:checked + .chk-box{background:var(--accent); border-color:var(--ink)}
.chk input:checked + .chk-box svg{opacity:1}
.chk input:focus-visible + .chk-box{box-shadow:0 0 0 3px var(--accent-soft)}
.stu-avatar{
  width:36px;height:36px;border-radius:10px;border:var(--line-soft) solid rgba(17,17,17,.16);
  background:var(--surface-2); display:grid;place-items:center; overflow:hidden; flex:none;
}
.stu-avatar img{width:100%;height:100%;object-fit:contain;display:block}
.stu-avatar.is-egg{background:#FFF6DC}
.stu-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.stu-name{
  display:flex;align-items:center;gap:5px;min-width:0;
  font-size:var(--t-md); font-weight:800; letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.stu-name .nm{overflow:hidden; text-overflow:ellipsis}
.stu-lv{
  flex:none; font-size:11px; font-weight:900; padding:0 5px; height:17px; line-height:17px;
  border:1px solid rgba(17,17,17,.55); border-radius:5px; background:var(--surface); color:var(--ink);
}
.stu-meta{
  display:flex;align-items:center;gap:6px;min-width:0;
  font-size:var(--t-xs); color:var(--ink-3); font-weight:700; white-space:nowrap;
}
.stu-meta .no{font-variant-numeric:tabular-nums}
.stu-flag{
  flex:none; font-size:10.5px; font-weight:800; padding:0 5px; height:16px; line-height:15px; border-radius:4px;
  border:1px solid currentColor;
}
.stu-flag.absent{color:#B4452F; background:#FFF0EC}
.stu-flag.egg{color:#9A6B05; background:#FFF6DC}
.stu-flag.max{color:#8A6A00; background:#FFEFB8}
.stu-more{
  width:40px;height:100%; min-height:40px; border:var(--line-soft) solid transparent; border-radius:8px;
  background:transparent; color:var(--ink-2); font-size:18px; line-height:1; font-weight:800;
  display:grid; place-items:center; padding:0;
}
.stu-more:hover,.stu-more:focus-visible{background:var(--surface); border-color:rgba(17,17,17,.24); color:var(--ink); outline:none}
.stu-more[aria-expanded="true"]{background:var(--ink); color:var(--canvas); border-color:var(--ink)}
.stu-exp{grid-column:1/-1; height:4px; border-radius:99px; background:rgba(17,17,17,.10); overflow:hidden; margin-top:2px}
.stu-exp span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width 260ms ease}
.stu-exp.shimmer span{animation:expShimmer 700ms ease}
.stu-row.pulse{animation:rowPulse 600ms ease}
@keyframes expShimmer{0%{filter:brightness(1)}35%{filter:brightness(1.45)}100%{filter:brightness(1)}}
@keyframes rowPulse{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}

/* ============================== 赋分台 380px ============================== */
.dock{
  display:flex; flex-direction:column; min-height:0; min-width:0;
  border-left:var(--line) solid var(--ink); background:var(--surface); z-index:20;
}
.dock-head{
  flex:none; display:flex; align-items:center; gap:8px; padding:14px var(--s4);
  border-bottom:1px solid rgba(17,17,17,.12);
}
.dock-head h2{margin:0;font-size:var(--t-lg);font-weight:800;letter-spacing:.01em}
.dock-head .dock-sub{font-size:var(--t-xs);color:var(--ink-3);font-weight:700}
.dock-head .live{
  margin-left:auto; display:inline-flex;align-items:center;gap:6px;
  font-size:var(--t-xs);font-weight:800;color:var(--accent);
}
.dock-head .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block;box-shadow:0 0 0 3px var(--accent-soft)}
.dock-scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 var(--s4)}
.dock-sec{padding:12px 0; border-bottom:1px solid rgba(17,17,17,.10)}
.dock-sec:last-child{border-bottom:0}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-title{font-size:var(--t-xs); font-weight:800; letter-spacing:.1em; color:var(--ink-3)}
.sec-count{
  font-size:11px;font-weight:900;padding:0 6px;height:18px;line-height:17px;border-radius:99px;
  background:var(--ink); color:var(--canvas);
}
.sec-head .sec-act{margin-left:auto}
.link-btn{
  border:0;background:transparent;color:var(--ink-2);font-size:var(--t-sm);font-weight:800;
  padding:4px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:2px;
}
.link-btn:hover{color:var(--ink);background:var(--surface-2)}
.link-btn:disabled{color:var(--ink-3);text-decoration:none;cursor:not-allowed;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 4px;
  border:var(--line-soft) solid var(--ink);border-radius:var(--r-pill);background:var(--surface-2);
  font-size:var(--t-sm);font-weight:800;max-width:100%;
}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:contain;background:var(--surface);border:1px solid rgba(17,17,17,.16)}
.chip .chip-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.chip .chip-x{
  width:22px;height:22px;border:0;border-radius:50%;background:rgba(17,17,17,.08);color:var(--ink-2);
  font-size:12px;line-height:1;display:grid;place-items:center;flex:none;
}
.chip .chip-x:hover{background:var(--ink);color:var(--canvas)}
.chip.more{background:var(--ink);color:var(--canvas);padding:0 10px}

  /* ============================================================

  var audioCtx = null;
  function playChime(type) {
    if (!state.sound) return;
    if (type === 'neg' && state.quiet) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var now = audioCtx.currentTime;
      function tone(freq, start, dur, gainVal, waveform) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = waveform || 'sine';
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(gainVal, now + start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + start); osc.stop(now + start + dur + 0.02);
      }
      if (type === 'select') { tone(520, 0, 0.08, 0.05); }
      else if (type === 'tick') { tone(640, 0, 0.045, 0.035, 'square'); }
      else if (type === 'stamp') { tone(523.25, 0, 0.16, 0.06, 'triangle'); tone(783.99, 0.08, 0.2, 0.05, 'triangle'); }
      else if (type === 'neg') { tone(320, 0, 0.14, 0.05, 'sawtooth'); tone(220, 0.1, 0.18, 0.04, 'sawtooth'); }
      else if (type === 'undo') { tone(420, 0, 0.1, 0.045); tone(300, 0.08, 0.14, 0.04); }
      else if (type === 'levelup') {
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.07, 0.36, 0.06, 'sine'); });
      }
    } catch (e) { /* 音频不可用时静默 */ }
  }

  /* ============================================================

  var toastTimer = null;

  var FX = (function () {
    var cv = $('#fx-canvas');
    var ctx = cv.getContext('2d');
    var parts = [];
    var raf = null;
    function resize() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.floor(window.innerWidth * dpr);
      cv.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();
    function burst(x, y, colors, count) {
      for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = 1.6 + Math.random() * 5.2;
        parts.push({
          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.1,
          life: 1, decay: 0.010 + Math.random() * 0.012,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 1.6 + Math.random() * 2.6
        });
      }
    }
    function loop() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.055; p.vx *= 0.992;
        p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.8), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (parts.length) { raf = requestAnimationFrame(loop); }
      else { raf = null; cv.style.display = 'none'; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    }
    var hideTimer = null;
    function start() {
      cv.style.display = 'block';
      if (!raf) raf = requestAnimationFrame(loop);
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        parts.length = 0;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        cv.style.display = 'none';
      }, 3200);
    }
    return {
      celebrate: function (x, y) {
        if (reducedMotion()) return;
        var colors = ['#267853', '#FFD45E', '#82B8F5', '#FF8D78', '#72C59A'];
        start(); burst(x, y, colors, 64);
        setTimeout(function () { if (reducedMotion()) return; start(); burst(x + (Math.random() * 160 - 80), y - 60, colors, 44); }, 260);
        setTimeout(function () { if (reducedMotion()) return; start(); burst(x + (Math.random() * 200 - 100), y + 30, colors, 30); }, 560);
      },
      burstAt: function (x, y) {
        if (reducedMotion()) return;
        start(); burst(x, y, ['#267853', '#FFD45E', '#72C59A'], 22);
      }
    };
  })();

  function themeRipple() {

  var GROUP_TINT = { 1: 'var(--mint)', 2: 'var(--sky)', 3: 'var(--sun)', 4: 'var(--coral)' };

  function matchesQuery(s) {
    if (!state.query) return true;

    var MAX = 4;
    var shown = state.chipsAll ? ids : ids.slice(0, MAX);
    var rest = ids.length - shown.length;
    var html = shown.map(function (id) {
      var s = byId(id);

      return '<span class="chip" data-chip="' + s.id + '">' +

  function applyScore(value, rule, opts) {
    opts = opts || {};
    var ids = Array.from(state.selected);
    if (!ids.length) {
      toast('请先勾选学生，再点击快捷赋分', 'warn');
      return;
    }
    var applied = [], skipped = [], levelUps = [], snaps = [];
    ids.forEach(function (id) {
      var s = byId(id);
      if (!s) return;
      if (s.archived) { skipped.push(s.name); return; }
      if (s.isAbsent) { skipped.push(s.name); return; }
      snaps.push({ id: s.id, level: s.level, exp: s.exp });
      s.exp += value;
      if (s.exp < 0) s.exp = 0;
      var ups = 0;
      while (s.level < 9 && s.exp >= s.maxExp) {
        if (s.isEgg) { s.exp = s.maxExp; break; }
        s.exp -= s.maxExp;
        s.level += 1;
        s.maxExp = s.level * state.expPerLevel;
        ups += 1;
      }
      if (s.level >= 9) {
        s.level = 9;
        s.maxExp = 9 * state.expPerLevel;
        if (s.exp > s.maxExp) s.exp = s.maxExp;
      }
      applied.push(s);
      if (ups) {
        levelUps.push(s);
        s.isMax = s.level >= 9;
        s.log.push({ time: nowTime(), tag: '升级', text: '宠物升级到 LV' + s.level });
      }
      s.log.push({
        time: nowTime(),
        tag: value >= 0 ? '加分' : '扣分',
        text: rule + ' ' + (value > 0 ? '+' : '') + value + '（' + state.subject + '）'
      });
    });
    if (!applied.length) {
      toast('所选学生均不可赋分（归档或缺勤）', 'warn');
      return;
    }
    var op = {
      id: 'op' + (state.seq++),
      time: nowTime(),
      ids: applied.map(function (s) { return s.id; }),
      names: applied.map(function (s) { return s.name; }),
      rule: rule,
      value: value,
      subject: state.subject,
      snaps: snaps,
      undone: false
    };
    state.history.push(op);
    state.lastOp = op;

    if (opts.event) {
      var rect = opts.event.currentTarget ? opts.event.currentTarget.getBoundingClientRect() : null;
      if (rect) {
        spawnFloat(rect.left + rect.width / 2, rect.top + 8, (value > 0 ? '+' : '') + value, value < 0);
        FX.burstAt(rect.left + rect.width / 2, rect.top + 10);
      }
    }
    if (levelUps.length) {
      var s0 = levelUps[0];
      var row = $('.stu-row[data-stu="' + s0.id + '"]');
      var r = row ? row.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0 };
      FX.celebrate(r.left + window.scrollX + r.width / 2, r.top + 60);
      playChime('levelup');
      toast('恭喜！' + levelUps.map(function (s) { return s.name + ' 的宠物升到 LV' + s.level; }).join('、'));
    } else {
      playChime(value < 0 ? 'neg' : 'stamp');
      toast(applied.length + ' 人 · ' + rule + ' ' + (value > 0 ? '+' : '') + value + ' · ' + state.subject + '（模拟）' + (skipped.length ? '，跳过 ' + skipped.length + ' 人（缺勤/归档）' : ''));
    }
    renderLanes(); renderDock(); renderBatch();
    applied.forEach(function (s) {
      var row = $('.stu-row[data-stu="' + s.id + '"]');
      if (!row) return;
      if (!reducedMotion()) {
        row.classList.add('pulse');
        setTimeout(function () { row.classList.remove('pulse'); }, 620);
      }
      var bar = row.querySelector('.stu-exp');
      if (bar) {
        bar.classList.add('shimmer');
        setTimeout(function () { bar.classList.remove('shimmer'); }, 720);
      }
    });
  }

  function undoLast() {
    var op = null;
    for (var i = state.history.length - 1; i >= 0; i--) {
      if (!state.history[i].undone) { op = state.history[i]; break; }
    }
    if (!op) { toast('暂无可撤销的赋分记录', 'warn'); return; }
    op.snaps.forEach(function (snap) {
      var s = byId(snap.id);
      if (!s) return;
      s.level = snap.level;
      s.exp = snap.exp;
      s.maxExp = s.level * state.expPerLevel;
      s.isMax = s.level >= 9;
      s.log.push({ time: nowTime(), tag: '撤销', text: '撤销「' + op.rule + '」' });
    });
    op.undone = true;
    state.lastOp = op;
    renderLanes(); renderDock(); renderBatch();
    playChime('undo');
    toast('已撤销：' + op.ids.length + ' 人 · ' + op.rule + ' ' + (op.value > 0 ? '+' : '') + op.value);
  }

  var dataMenu = $('#data-menu');

  function placeMenu(menu, anchorRect, align) {
    menu.hidden = false;
    menu.style.left = '0px';
    menu.style.top = '0px';
    var m = menu.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var top = anchorRect.bottom + 8;
    if (top + m.height > vh - 8) top = anchorRect.top - m.height - 8;
    top = clamp(top, 8, Math.max(8, vh - m.height - 8));
    var left = align === 'right' ? anchorRect.right - m.width : anchorRect.left;
    left = clamp(left, 8, Math.max(8, vw - m.width - 8));
    menu.style.top = Math.round(top) + 'px';
    menu.style.left = Math.round(left) + 'px';
    return menu.getBoundingClientRect();
  }
  function onDocPointerDown(e) {
    if (dataMenu.hidden === false && !dataMenu.contains(e.target) && !$('#btn-data-menu').contains(e.target)) closeDataMenu();
    if (rowMenu.hidden === false && !rowMenu.contains(e.target)) closeRowMenu();
  }
  function openDataMenu() {
    var btn = $('#btn-data-menu');
    if (dataMenu.hidden === false) { closeDataMenu(); return; }
    closeRowMenu();
    placeMenu(dataMenu, btn.getBoundingClientRect(), 'right');
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('pointerdown', onDocPointerDown, true);
    window.addEventListener('resize', closeDataMenu);
    window.addEventListener('keydown', escToClose, true);
    playChime('select');
  }
  function closeDataMenu() {
    dataMenu.hidden = true;
    $('#btn-data-menu').setAttribute('aria-expanded', 'false');
    document.removeEventListener('pointerdown', onDocPointerDown, true);
    window.removeEventListener('resize', closeDataMenu);
    window.removeEventListener('keydown', escToClose, true);
  }
  function escToClose(e) { if (e.key === 'Escape') { closeDataMenu(); closeRowMenu(); } }

  function openRowMenu(id, btn) {
    id = Number(id);
    var s = byId(id);
    if (!s || !btn) return;
    if (state.rowMenuId === id) { closeRowMenu(); return; }
    closeDataMenu();
    state.rowMenuId = id;
    var title = rowMenu.querySelector('.menu-title');
    if (title) title.textContent = s.name + ' · #' + pad2(s.id);
    placeMenu(rowMenu, btn.getBoundingClientRect(), 'right');
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('pointerdown', onDocPointerDown, true);
    window.addEventListener('resize', closeRowMenu);
    window.addEventListener('keydown', escToClose, true);

    window.removeEventListener('resize', closeRowMenu);

  function downloadFile(name, text, mime) {
    try {
      var blob = new Blob(['\ufeff' + text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      return true;
    } catch (e) { toast('导出失败：' + e.message, 'warn'); return false; }
  }

  function renderLedgerTable(filterId) {
    var ops = state.history.slice().reverse();
    if (filterId && filterId !== 'all') ops = ops.filter(function (op) { return op.ids.indexOf(Number(filterId)) >= 0; });
    if (!ops.length) return '<div class="empty-state">台账为空。<br>给任意学生赋分后，这里会按时间倒序记录每一笔，并可单笔撤销。</div>';
    var rows = ops.map(function (op) {
      return '<tr class="' + (op.undone ? 'is-undone' : '') + '">' +
        '<td class="num">' + op.time + '</td>' +
        '<td>' + esc(op.names.join('、')) + '</td>' +
        '<td>' + esc(op.rule) + '</td>' +
        '<td>' + esc(op.subject) + '</td>' +
        '<td class="num"><b>' + (op.value > 0 ? '+' : '') + op.value + '</b></td>' +

          '<div class="field"><label>分值（−10 ~ +10）</label><div class="custom-step" style="max-width:190px">' +
            '<button type="button" id="rule-minus" aria-label="分值减一" title="减一">−</button>' +
            '<input class="step-val" id="rule-value" type="number" min="-10" max="10" step="1" value="2" readonly aria-label="当前分值">' +
            '<button type="button" id="rule-plus" aria-label="分值加一" title="加一">＋</button>' +
          '</div></div>' +
        '</div>' +
        '<div class="rule-list" id="rule-list">' + list + '</div>',

            var name = ($('#rule-name').value || '').trim();
            var v = Number($('#rule-value').value);
            if (!name) { toast('请填写规则名称', 'warn'); return; }
            if (!v || isNaN(v)) { toast('请填写非零分值', 'warn'); return; }

            renderExtraRules();

  var pendingImport = null;
  $('#file-input').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        if (pendingImport === 'backup') importBackup(String(reader.result));
        else importRoster(String(reader.result));
      } catch (err) {
        toast('导入失败：' + err.message + '（数据未改动）', 'warn');
      }
      pendingImport = null;
    };
    reader.onerror = function () { toast('文件读取失败，请重试', 'warn'); };
    reader.readAsText(file, 'utf-8');
  });

  function importRoster(text) {
    var lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) throw new Error('文件为空');
    if (/姓名/.test(lines[0])) lines.shift();
    var parsed = [];
    lines.forEach(function (line) {
      var cols = line.split(',').map(function (c) { return c.trim(); });
      var id = Number(cols[0]);
      var name = cols[1];
      if (!name) return;
      if (!id || parsed.some(function (p) { return p.id === id; })) id = (parsed.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1);
      var level = clamp(Number(cols[3]) || 1, 1, 9);
      parsed.push({
        id: id, name: name, group: clamp(Number(cols[2]) || 1, 1, 4),
        level: level, exp: clamp(Number(cols[4]) || 0, 0, level * state.expPerLevel),
        maxExp: level * state.expPerLevel, isEgg: false, isAbsent: false, isMax: level >= 9,
        archived: false, species: SPECIES_ORDER[(id - 1) % SPECIES_ORDER.length],
        log: [{ time: nowTime(), tag: '导入', text: '从 CSV 导入' }]
      });
    });
    if (!parsed.length) throw new Error('未解析到有效学生行');
    state.students = parsed;
    state.selected.clear();
    state.history = []; state.lastOp = null;
    closeDialog(); renderLanes(); renderDock(); renderBatch();
    toast('已导入 ' + parsed.length + ' 名学生（覆盖当前模拟名单）');
  }

  function importBackup(text) {
    var data = JSON.parse(text);
    if (!data || !Array.isArray(data.students) || !data.students.length) throw new Error('备份文件格式不正确');
    if (data.expPerLevel) state.expPerLevel = clamp(Number(data.expPerLevel) || 40, 15, 80);
    state.students = data.students.map(function (s) {
      var level = clamp(Number(s.level) || 1, 1, 9);
      return {
        id: Number(s.id) || 0, name: String(s.name || '未命名'), group: clamp(Number(s.group) || 1, 1, 4),
        species: SPECIES[s.species] ? s.species : 'cat', level: level,
        exp: clamp(Number(s.exp) || 0, 0, level * state.expPerLevel),
        maxExp: level * state.expPerLevel,
        isEgg: !!s.isEgg, isAbsent: !!s.isAbsent, isMax: level >= 9, archived: !!s.archived,
        log: [{ time: nowTime(), tag: '还原', text: '从 JSON 备份还原' }]
      };
    });
    state.selected.clear();
    state.history = []; state.lastOp = null;
    if (data.theme && THEME_NAMES[data.theme]) setTheme(data.theme, false);
    closeDialog(); renderLanes(); renderDock(); renderBatch();
    toast('已还原备份：' + state.students.length + ' 人 · 阈值 ' + state.expPerLevel + ' EXP/级');
  }

  function resetData() {
    buildStudents();
    state.selected.clear();
    state.history = []; state.lastOp = null;
    state.chipsAll = false;
    renderLanes(); renderDock(); renderBatch();
    toast('已恢复初始模拟数据（32 人 · 4 组）');

    }

    toggleSelect(cb.getAttribute('data-stu'), cb.checked);

    var less = e.target.closest('[data-show-less]');
    if (less) { state.chipsAll = false; renderChips(); return; }
    var score = e.target.closest('[data-score]');
    if (score) {
      var v = Number(score.getAttribute('data-score'));
      var rule = score.getAttribute('data-rule');

  $('#btn-undo').addEventListener('click', undoLast);
  $('#btn-open-ledger').addEventListener('click', openLedgerDialog);
  $('#btn-custom-rule').addEventListener('click', openRuleDialog);
  $('#quiet-mode').addEventListener('change', function () {
    state.quiet = this.checked;
    store('classpet_v3_quiet', state.quiet ? 'on' : 'off');
    toast(state.quiet ? '扣分音效已静音（仍会记入台账）' : '扣分音效已恢复');
  });


  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if (state.rowMenuId !== null) { closeRowMenu(); return; }
      if (dataMenu.hidden === false) { closeDataMenu(); return; }
      if (dlg.open) { closeDialog(); return; }
      if (typing) { e.target.blur(); return; }
      if (state.selected.size) { clearSelection(); return; }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 'j') { e.preventDefault(); applyScore(2, '积极发言'); }
    else if (k === 'k') { e.preventDefault(); applyScore(-1, '小声提醒'); }
    else if (k === 'z') { e.preventDefault(); undoLast(); }
    else if (e.key === '/') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
    else if (k === 'a') { e.preventDefault(); selectAllVisible(); }
  });

  /* ============================================================
     16. 自检契约（spec §8）—— 必须随页面交付
     ============================================================ */
  var consoleErrors = [];
  window.addEventListener('error', function (e) {
    consoleErrors.push('error: ' + (e.message || 'unknown') + ' @' + (e.filename || '') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    consoleErrors.push('unhandledrejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
  });
  var nativeConsoleError = console.error.bind(console);
  console.error = function () {
    try { consoleErrors.push('console.error: ' + Array.prototype.map.call(arguments, String).join(' ')); } catch (err) {}
    nativeConsoleError.apply(null, arguments);
  };

  function insideScrollViewport(el) {
    var p = el.parentElement;
    while (p && p !== document.body) {
      var cs = getComputedStyle(p);
      var scrollable = /(auto|scroll)/.test(cs.overflowY) || /(auto|scroll)/.test(cs.overflowX);
      if (scrollable) {
        var r = p.getBoundingClientRect(), er = el.getBoundingClientRect();
        var cx = er.left + er.width / 2, cy = er.top + er.height / 2;
        if (cy < r.top - 0.5 || cy > r.bottom + 0.5 || cx < r.left - 0.5 || cx > r.right + 0.5) return false;
      }
      p = p.parentElement;
    }
    return true;
  }
  function clippedBy(el) {
    var p = el.parentElement;
    while (p && p !== document.body) {
      var cs = getComputedStyle(p);
      var er = el.getBoundingClientRect(), r = p.getBoundingClientRect();
      var clipY = /(hidden|clip)/.test(cs.overflowY);
      var clipX = /(hidden|clip)/.test(cs.overflowX);
      if (clipX && (er.left < r.left - 1.5 || er.right > r.right + 1.5)) return p;
      if (clipY && (er.top < r.top - 1.5 || er.bottom > r.bottom + 1.5)) return p;
      if (/(auto|scroll)/.test(cs.overflowY) || /(auto|scroll)/.test(cs.overflowX)) return null;
      p = p.parentElement;
    }
    var de = document.documentElement;
    var dr = el.getBoundingClientRect();
    if (dr.right > de.clientWidth + 1 || dr.bottom > de.clientHeight + 1) return de;
    return null;
  }
  function selPath(el) {
    if (!el) return 'unknown';
    if (el.id) return '#' + el.id;
    var audit = el.getAttribute && el.getAttribute('data-audit');
    if (audit) return '[data-audit="' + audit + '"]';
    var cls = (el.className && typeof el.className === 'string') ? el.className.trim().split(/\s+/)[0] : '';
    return el.tagName.toLowerCase() + (cls ? '.' + cls : '');
  }
  function controlLabel(el) {
    var l = el.getAttribute('data-audit-label');
    if (!l) l = (el.getAttribute('aria-label') || '').trim();
    if (!l) l = (el.getAttribute('title') || '').trim();
    if (!l) l = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!l && el.placeholder) l = el.placeholder;
    return (l || '').slice(0, 40);
  }
  function collectControls() {
    return $$('[data-audit]').map(function (el) {
      var rect = el.getBoundingClientRect();
      var cs = getComputedStyle(el);
      var onScreen = rect.width > 0 && rect.height > 0 && cs.display !== 'none' && cs.visibility !== 'hidden' && el.getClientRects().length > 0 && insideScrollViewport(el);
      var clickable = false, centerHit = false, disabled = false;
      if (onScreen) {
        disabled = el.disabled === true || el.getAttribute('aria-disabled') === 'true';
        clickable = !disabled && rect.width >= 16 && rect.height >= 16;
        var cx = clamp(rect.left + rect.width / 2, 1, window.innerWidth - 1);
        var cy = clamp(rect.top + rect.height / 2, 1, window.innerHeight - 1);
        var hit = document.elementFromPoint(cx, cy);
        centerHit = !!(hit && (hit === el || el.contains(hit)));
      }
      return {
        id: el.getAttribute('data-audit'),
        label: controlLabel(el),
        visible: onScreen,
        clickable: clickable,
        centerHit: centerHit,
        disabled: disabled,
        allowDisabled: el.hasAttribute('data-allow-disabled')
      };
    });
  }
  function probeMenu(menuEl, openFn) {
    openFn();
    var r = menuEl.getBoundingClientRect();
    var items = $$('.menu-item', menuEl).map(function (el) {
      var ir = el.getBoundingClientRect();
      var hit = document.elementFromPoint(clamp(ir.left + ir.width / 2, 1, window.innerWidth - 1), clamp(ir.top + ir.height / 2, 1, window.innerHeight - 1));
      return {
        id: el.getAttribute('data-audit'),
        label: controlLabel(el),
        visible: ir.width > 4 && ir.height > 4,
        centerHit: !!(hit && (hit === el || el.contains(hit))),
        inViewport: ir.left >= -1 && ir.top >= -1 && ir.right <= window.innerWidth + 1 && ir.bottom <= window.innerHeight + 1
      };
    });
    var res = {
      menu: menuEl.id,
      box: { left: Math.round(r.left), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom) },
      inViewport: r.left >= -1 && r.top >= -1 && r.right <= window.innerWidth + 1 && r.bottom <= window.innerHeight + 1,
      items: items
    };
    return res;
  }
  function closeMenusForAudit() {
    closeDataMenu(); closeRowMenu();
  }

  window.__v3audit = function () {
    closeMenusForAudit();
    var savedScroll = [];
    Array.prototype.forEach.call(document.querySelectorAll('*'), function (el) {
      if ((el.scrollTop || el.scrollLeft) && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
        savedScroll.push([el, el.scrollTop, el.scrollLeft]);
        el.scrollTop = 0; el.scrollLeft = 0;
      }
    });
    var overflow = {
      scrollH: document.documentElement.scrollHeight,
      innerH: window.innerHeight,
      scrollW: document.documentElement.scrollWidth,
      innerW: window.innerWidth
    };
    var controls = collectControls();
    var occluded = [], clipped = [];
    controls.forEach(function (c) {
      var el = $('[data-audit="' + c.id + '"]');
      if (!el) return;
      if (c.visible) {
        if (!c.centerHit && !(c.disabled && c.allowDisabled)) {
          var rect = el.getBoundingClientRect();
          var hit = document.elementFromPoint(clamp(rect.left + rect.width / 2, 1, window.innerWidth - 1), clamp(rect.top + rect.height / 2, 1, window.innerHeight - 1));
          occluded.push({ selector: selPath(el), coveredBy: selPath(hit) });
        }
        var by = clippedBy(el);
        if (by) clipped.push({ selector: selPath(el), byContainer: selPath(by) });
      }
    });

    var rows = $$('.stu-row');
    var firstMore = rows.length ? rows[0].querySelector('.stu-more') : null;
    var visibleRows = rows.filter(function (r) { return insideScrollViewport(r); });
    var lastRow = visibleRows.length ? visibleRows[visibleRows.length - 1] : (rows.length ? rows[rows.length - 1] : null);
    var lastMore = lastRow ? lastRow.querySelector('.stu-more') : null;
    var menuProbes = [];
    var dataProbe = probeMenu(dataMenu, openDataMenu);
    menuProbes.push(dataProbe);
    closeDataMenu();
    var dataClosed = dataMenu.hidden === true && getComputedStyle(dataMenu).display === 'none';
    var rowProbe = null, rowClosed = true, residualHit = null;
    if (firstMore) {
      rowProbe = probeMenu(rowMenu, function () { openRowMenu(firstMore.getAttribute('data-stu'), firstMore); });
      menuProbes.push(rowProbe);
      closeRowMenu();
      rowClosed = rowMenu.hidden === true && getComputedStyle(rowMenu).display === 'none';
      var probeRow = visibleRows.length ? visibleRows[0] : rows[0];
      var rr = probeRow.getBoundingClientRect();
      var hit = document.elementFromPoint(clamp(rr.left + rr.width / 2, 1, window.innerWidth - 1), clamp(rr.top + rr.height / 2, 1, window.innerHeight - 1));
      residualHit = hit === probeRow || probeRow.contains(hit) ? null : selPath(hit);
    }
    var edgeProbe = null;
    if (lastMore) {
      edgeProbe = probeMenu(rowMenu, function () { openRowMenu(lastMore.getAttribute('data-stu'), lastMore); });
      closeRowMenu();
    }

    var required = ['btn-portal', 'btn-bigscreen', 'btn-data-menu', 'mi-ledger', 'mi-excel', 'mi-threshold', 'mi-backup',
      'mi-theme-orange', 'mi-theme-forest', 'mi-theme-ocean', 'mi-sound', 'mi-fullscreen', 'mi-reset',
      'subject2-yuwen', 'subject2-shuxue', 'subject2-yingyu',
      'search-input', 'btn-add', 'btn-select-all', 'btn-clear-sel', 'btn-move-group',
      'sel-clear', 'btn-open-ledger', 'btn-undo', 'btn-custom-rule', 'quiet-mode',
      'rm-log', 'rm-edit', 'dlg-close', 'dlg-cancel'];
    var present = {};
    controls.forEach(function (c) { present[c.id] = true; });
    var missing = required.filter(function (id) { return !present[id]; });

    var badControls = controls.filter(function (c) {
      return c.visible && (!c.clickable && !(c.disabled && c.allowDisabled) || !c.centerHit && !(c.disabled && c.allowDisabled));
    }).map(function (c) { return c.id; });
    var unlabeled = controls.filter(function (c) { return !c.label; }).map(function (c) { return c.id; });

    var menuOK = menuProbes.every(function (p) {
      return p.inViewport && p.items.every(function (i) { return i.visible && i.inViewport && i.centerHit; });
    }) && (edgeProbe ? edgeProbe.inViewport && edgeProbe.items.every(function (i) { return i.inViewport; }) : true);

    savedScroll.forEach(function (item) { item[0].scrollTop = item[1]; item[0].scrollLeft = item[2]; });

    var pass = overflow.scrollH <= overflow.innerH + 1 && overflow.scrollW <= overflow.innerW + 1 &&
      consoleErrors.length === 0 && occluded.length === 0 && clipped.length === 0 && missing.length === 0 &&
      badControls.length === 0 && unlabeled.length === 0 && menuOK && dataClosed && rowClosed && residualHit === null && edgeProbe !== null;

    return {
      page: 'teacher',
      controls: controls.map(function (c) {
        return { id: c.id, label: c.label, visible: c.visible, clickable: c.clickable, centerHit: c.centerHit };
      }),
      occluded: occluded,
      clipped: clipped,
      overflow: overflow,
      consoleErrors: consoleErrors.slice(),
      pass: !!pass,
      menus: menuProbes,
      rowMenuTest: { closed: rowClosed, dataMenuClosed: dataClosed, residualHit: residualHit, edgeFlip: edgeProbe },
      badControls: badControls,
      missing: missing,
      unlabeled: unlabeled
    };
  };

  /* ============================================================
     17. 启动
     ============================================================ */
  function init() {
    document.documentElement.setAttribute('data-theme', state.theme);
    buildStudents();
    state.extraRules = [
      { name: '朗读之星', value: 2 },
      { name: '桌面凌乱', value: -1 }
    ];
    setScale(state.scale);
    setSound(state.sound, { silent: true });
    $('#sound-state').textContent = state.sound ? '开启' : '关闭';
    $('#quiet-mode').checked = state.quiet;
    renderExtraRules();
    renderLanes();
    renderDock();
    renderBatch();
    window.__v3 = {
      state: state,
      applyScore: applyScore,
      undoLast: undoLast,
      setSelection: setSelection,
      clearSelection: clearSelection,
      selectAllVisible: selectAllVisible,
      setFilter: setFilter,
      setSubject: setSubject,
      setSort: setSort,
      openDataMenu: openDataMenu,
      closeDataMenu: closeDataMenu,
      openRowMenu: openRowMenu,
      closeRowMenu: closeRowMenu,
      openDialog: openDialog,
      closeDialog: closeDialog,
      renderLanes: renderLanes,
      renderDock: renderDock,
      renderBatch: renderBatch,
      hatch: hatch
    };
    if (/[?&]audit=1/.test(location.search)) {
      setTimeout(function () {
        var result = window.__v3audit();
        window.__v3auditResult = result;
        console.log('V3AUDIT', JSON.stringify(result));
      }, 120);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
